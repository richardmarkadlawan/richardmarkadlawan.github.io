    function() {
      // 1. Clear main data key
      localStorage.removeItem(STORAGE_KEY);

      // 2. Clear SP lock states (sp1-locked through sp6-locked)
      for (var n = 1; n <= 6; n++) {
        localStorage.removeItem('sp' + n + '-locked');
      }

      // 3. Clear theme preference (reset to dark)
      localStorage.removeItem('cargo-theme');

      // 4. Clear any other known localStorage keys this app uses
      // (future-proof: clear all keys that start with CARGO_)
      var keysToRemove = [];
      for (var i = 0; i < localStorage.length; i++) {
        var k = localStorage.key(i);
        if (k && (k.indexOf('CARGO') === 0 || k.indexOf('sp') === 0)) {
          keysToRemove.push(k);
        }
      }
      keysToRemove.forEach(function(k) { localStorage.removeItem(k); });

      window.dailyData         = {};

      window._hogSagLine       = null;

// ========================================
// EXPORT — download all app data as .json
// ========================================
// EXPORT SYSTEM — iOS/Android/Desktop compatible
// Strategy:
//   1. Build JSON string, store in module-level var (never on DOM node)
//   2. Try programmatic <a download> click (works on desktop + Android)
//   3. Always open the Export Modal which gives the user 3 iOS-safe methods:
//      A) "OPEN AS FILE" — opens data: URI in new tab; user can long-press → Save
//      B) "COPY TO CLIPBOARD" — pastes into Notes/Files app on iPhone
//      C) Scrollable textarea — tap to select all, then manual copy
// ========================================
var _exportJsonCache = '';
var _exportFilename  = '';

function exportData() {
  try {
    // 1. Sync voy-header value into #voy so STATIC_INPUT_IDS captures it
    var voyH  = document.getElementById('voy-header');
    var voyEl = document.getElementById('voy');
    if (voyH && voyEl && voyH.value) voyEl.value = voyH.value;

    // 2. Sync daily date inputs back into array
    dailyDates.forEach(function(d, di) {
      var el = document.getElementById('date-inp-' + di);
      if (el && el.value) dailyDates[di] = el.value;
    });

    // 3. Build complete data object — matches exactly what restoreAll() expects
    var data = {
      inputs:            {},
      daily:             { dates: dailyDates, cells: {} },
      dailyTimesPerDate: window.dailyTimesPerDate || [],
      dailyData:         window.dailyData || {},
      dprLog:            dprLog,
      dprInputs:         {},
      settings:          {}
    };

    // 4. Capture every static input
    STATIC_INPUT_IDS.forEach(function(id) {
      var el = document.getElementById(id);
      if (el) data.inputs[id] = el.value;
    });

    // 4b. Capture WeChat dates (not always in STATIC_INPUT_IDS)
    ['0530','1500','1730'].forEach(function(t) {
      var el = document.getElementById('wc' + t + '-date');
      if (el) data.inputs['wc' + t + '-date'] = el.value;
    });

    // 5. Capture all DPR calculator inputs
    ['dpr-prev','dpr-curr','dpr-date','dpr-time','dpr-start-date','dpr-start-time'].forEach(function(id) {
      var el = document.getElementById(id);
      if (el) data.dprInputs[id] = el.value;
    });

    // 6. Capture settings: heel sign, SP locks, theme
    var heelBtn = document.getElementById('heel-sign-btn');
    if (heelBtn) data.settings.heelSign = heelBtn.getAttribute('data-sign');

    data.settings.spLocks = {};
    for (var ln = 1; ln <= 6; ln++) {
      data.settings.spLocks[ln] = localStorage.getItem('sp' + ln + '-locked') === '1';
    }
    data.settings.theme = document.body.classList.contains('light-mode') ? 'light' : 'dark';

    // Capture which rnd inputs are truly manually overridden (not auto-filled)
    data.settings.rndManual = [1,2,3,4,5,6].filter(function(n) {
      var el = document.getElementById('rnd' + n);
      return el && el.dataset.userEdited === '1';
    });

    // 7. Daily log cells (legacy + new dailyData already captured above)
    dailyDates.forEach(function(d, di) {
      var times = (window.dailyTimesPerDate && window.dailyTimesPerDate[di]) || [];
      times.forEach(function(t, ti) {
        DAILY_ROWS.forEach(function(row, ri) {
          var id = 'dl-' + ri + '-' + di + '-' + ti;
          var el = document.getElementById(id);
          if (el && el.value) data.daily.cells[id] = el.value;
        });
      });
    });

    // 7. Build filename with timestamp
    var now = new Date();
    var dd  = String(now.getDate()).padStart(2,'0');
    var mm  = String(now.getMonth()+1).padStart(2,'0');
    var yy  = now.getFullYear();
    var hh  = String(now.getHours()).padStart(2,'0');
    var mn  = String(now.getMinutes()).padStart(2,'0');

    _exportFilename  = 'CARGO_DATA_' + dd + mm + yy + '_' + hh + mn + '.json';
    _exportJsonCache = JSON.stringify(data, null, 2);

    // 7b. Android WebView: route through native save dialog (blob/<a download> is ignored)
    if (window.AndroidBridge && typeof window.AndroidBridge.exportFile === 'function') {
      var _jb64 = btoa(unescape(encodeURIComponent(_exportJsonCache)));
      window.AndroidBridge.exportFile(_exportFilename, 'application/json', _jb64);
      var _ind = document.getElementById('save-indicator');
      if (_ind) {
        var _prevTxt = getSaveIndicator();
        setSaveIndicator(ICO_IMPORT, 'EXPORTED');
        _ind.style.opacity = '1';
        setTimeout(function() { setSaveIndicator(_prevTxt.ico, _prevTxt.txt); _ind.style.opacity = '0'; }, 2500);
      }
      return;
    }

    // 7c. iOS WKWebView ignores blob downloads too — hand off to the native share sheet
    //     ("Save to Files"). See the ios-app-build skill.
    if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) {
      window.webkit.messageHandlers.iosBridge.postMessage({
        filename: _exportFilename,
        mime: 'application/json',
        base64: btoa(unescape(encodeURIComponent(_exportJsonCache)))
      });
      var _iInd = document.getElementById('save-indicator');
      if (_iInd) {
        var _iPrev = getSaveIndicator();
        setSaveIndicator(ICO_IMPORT, 'EXPORTED');
        _iInd.style.opacity = '1';
        setTimeout(function() { setSaveIndicator(_iPrev.ico, _iPrev.txt); _iInd.style.opacity = '0'; }, 2500);
      }
      return;
    }

    // 8. Download via Blob + createObjectURL — reliable on desktop & Android
    //    data: URI + .download attribute is blocked by modern browsers
    try {
      var blob = new Blob([_exportJsonCache], { type: 'application/json' });
      var url  = URL.createObjectURL(blob);
      var a    = document.createElement('a');
      a.href        = url;
      a.download    = _exportFilename;
      a.style.display = 'none';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function() { URL.revokeObjectURL(url); }, 3000);
    } catch(e2) { /* iOS blocks this — modal below handles it */ }

    // 9. Always show modal — iOS needs it; desktop gets confirmation
    showExportModal();

    // 10. Flash save indicator
    var ind = document.getElementById('save-indicator');
    if (ind) {
      var prevTxt = getSaveIndicator();
      setSaveIndicator(ICO_IMPORT, 'EXPORTED');
      ind.style.opacity = '1';
      setTimeout(function() { setSaveIndicator(prevTxt.ico, prevTxt.txt); ind.style.opacity = '0'; }, 2500);
    }

  } catch(e) {
    alert('Export failed: ' + e.message);
  }
}

function exportCopyToClipboard() {
  var jsonStr = _exportJsonCache || '';
  var msgEl   = document.getElementById('export-copy-msg');
  var btn     = document.getElementById('export-copy-btn');

  function onSuccess() {
    if (msgEl) { setIconText(msgEl, ICO_CHECK, 'COPIED — paste into a .json file on your desktop, then Import.'); msgEl.style.color = '#7fbf9b'; msgEl.style.display = 'block'; }
    if (btn)   { setIconText(btn, ICO_CHECK, 'COPIED!'); setTimeout(function() { setIconText(btn, ICO_COPY, 'COPY TO CLIPBOARD'); }, 3000); }
  }
  function onFail() {
    var ta = document.getElementById('export-json-area');
    if (ta) { ta.select(); ta.setSelectionRange(0, 99999); }
    if (msgEl) { setIconText(msgEl, ICO_ALERT, 'Auto-copy failed — text is selected, copy it manually.'); msgEl.style.color = '#f4a30a'; msgEl.style.display = 'block'; }
  }

  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(jsonStr).then(onSuccess).catch(onFail);
  } else {
    // execCommand fallback (older WebKit)
    var ta = document.getElementById('export-json-area');
    if (ta) {
      ta.select();
      ta.setSelectionRange(0, 99999);
      try {
        var ok = document.execCommand('copy');
        if (ok) { onSuccess(); } else { onFail(); }
      } catch(e) { onFail(); }
    } else { onFail(); }
  }
}

// IMPORT — load .json file into app
// ========================================
function importData(event) {
  const file = event.target.files[0];
  if (!file) return;
  // Reset input so same file can be re-imported if needed
  event.target.value = '';

  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      // Strip UTF-8 BOM (EF BB BF) and any leading/trailing whitespace
      // iOS Files app and some text editors add these silently
      var raw = e.target.result;
      if (typeof raw === 'string') {
        raw = raw.replace(/^\uFEFF/, '').trim(); // remove BOM + trim
      }

      var data;
      try {
        data = JSON.parse(raw);
      } catch(parseErr) {
        // Show first 200 chars so user can see what was actually received
        var preview = raw ? raw.substring(0, 200) : '(empty file)';
        alert('Import failed — the file could not be read as JSON.\n\nError: ' + parseErr.message + '\n\nFile starts with:\n' + preview);
        return;
      }

      // Validate it looks like our export format
      if (!data.inputs && !data.dprLog) {
        alert('Invalid file — this does not appear to be a Cargo Level export.\n\nMake sure you are selecting the correct .json file exported from this app.');
        return;
      }

      // iOS Safari silently suppresses confirm() from async FileReader callbacks
      // Use the iOS-safe DOM overlay instead
      var inputCount  = Object.keys(data.inputs  || {}).length;
      var dprCount    = (data.dprLog || []).length;
      var dateCount   = ((data.daily || {}).dates || []).length;

      _showDelConfirm(
        'IMPORT & OVERWRITE DATA?\n\n' +
        'File contains:\n' +
        '• ' + inputCount + ' input values\n' +
        '• ' + dprCount   + ' DPR log entries\n' +
        '• ' + dateCount  + ' daily log dates\n\n' +
        'Your current data will be replaced.',
        function() {
          // Confirmed — write to localStorage and reload
          if (data.settings && data.settings.spLocks) {
            Object.keys(data.settings.spLocks).forEach(function(n) {
              localStorage.setItem('sp' + n + '-locked', data.settings.spLocks[n] ? '1' : '0');
            });
          }
          if (data.settings && data.settings.theme) {
            localStorage.setItem('cargo-theme', data.settings.theme);
          }
          localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
          location.reload();
        },
        'IMPORT',
        'CANCEL'
      );

    } catch(err) {
      alert('Import failed — unexpected error.\n' + err.message);
    }
  };
  reader.onerror = function() {
    alert('Import failed — could not read the file. Please try again.');
  };
  reader.readAsText(file, 'UTF-8');
}

// ─── DPR: parse date+timeStr ("0530","2400") into a Date object ──────────────
function parseDPRDateTime(dateStr, timeStr) {
  if (!dateStr) return null;
  var h = parseInt(timeStr.slice(0,2), 10);
  var m = parseInt(timeStr.slice(2,4), 10);
  var extraDay = 0;
  if (h >= 24) { h = 0; extraDay = 1; }
  var d = new Date(dateStr + 'T' + String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0') + ':00');
  if (extraDay) d.setDate(d.getDate() + 1);
  return isNaN(d.getTime()) ? null : d;
}

function calcDPR() {
  const prev = parseFloat(document.getElementById('dpr-prev').value);
  const curr = parseFloat(document.getElementById('dpr-curr').value);
  const plan = getN('tc-val');

  const errEl   = document.getElementById('dpr-error');
  const resBox  = document.getElementById('dpr-result-box');
  const res24h  = document.getElementById('dpr-result-24h');
  const resRate = document.getElementById('dpr-result-rate');
  const resRem  = document.getElementById('dpr-result-rem');

  // Plan always linked
  setText('dpr-sc-plan',     fmt(plan));
  setText('dpr-plan-linked', fmt(plan) + ' MT');

  errEl.style.display  = 'none';
  resBox.style.display = 'none';

  const currRaw = (document.getElementById('dpr-curr') || {}).value || '';
  if (isNaN(curr) || currRaw.trim() === '') {
    if (dprLog.length === 0) { setText('dpr-sc-24h','—'); setText('dpr-sc-rate','—'); setText('dpr-sc-current','—'); }
    updateDPRETA(NaN, NaN, plan);
    return;
  }

  setText('dpr-sc-current', fmt(curr));
  setText('dpr-sc-remain',  fmt(Math.max(plan - curr, 0)));

  if (curr < prev) {
    setIconText(errEl, ICO_ALERT, 'Error: Current total cannot be less than previous total.');
    errEl.style.display = 'block';
    setText('dpr-sc-24h','ERROR'); setText('dpr-sc-rate','ERROR');
    updateDPRETA(NaN, NaN, plan);
    return;
  }

  // ── Parse commenced date/time ────────────────────────────────────────────
  const startDateStr = (document.getElementById('dpr-start-date') || {}).value || '';
  const startTimeStr = (document.getElementById('dpr-start-time') || {}).value || '0000';
  const commencedDT  = parseDPRDateTime(startDateStr, startTimeStr);

  // ── Parse current report date/time ──────────────────────────────────────
  const currDateStr = (document.getElementById('dpr-date') || {}).value || '';
  const currTimeStr = (document.getElementById('dpr-time') || {}).value || '1730';
  const currentDT   = parseDPRDateTime(currDateStr, currTimeStr);

  // ── Determine previous date/time ─────────────────────────────────────────
  // If log empty → use commenced DT; else use last entry's rawDateISO
  let prevDT = null;
  if (dprLog.length === 0) {
    prevDT = commencedDT;
  } else {
    const lastISO = dprLog[dprLog.length - 1].rawDateISO;
    prevDT = lastISO ? new Date(lastISO) : commencedDT;
  }

  // ── Calculate period hours ───────────────────────────────────────────────
  let periodRate = NaN;
  let qtyPeriod  = isNaN(prev) ? curr : (curr - prev);
  let diffHours  = NaN;

  if (currentDT && prevDT) {
    diffHours = (currentDT - prevDT) / (1000 * 60 * 60);
    if (diffHours > 0) {
      periodRate = qtyPeriod / diffHours;
    } else {
      setIconText(errEl, ICO_ALERT, 'Error: Report date/time must be after previous entry or commenced time.');
      errEl.style.display = 'block';
      updateDPRETA(NaN, NaN, plan);
      return;
    }
  }

  // ── Overall average rate: total loaded ÷ total hours elapsed ─────────────
  let overallAvgRate = NaN;
  if (commencedDT && currentDT) {
    const totalHoursElapsed = (currentDT - commencedDT) / (1000 * 60 * 60);
    if (totalHoursElapsed > 0) {
      overallAvgRate = curr / totalHoursElapsed;
    }
  }
  // Fallback: average of log rates if commenced not set
  if (isNaN(overallAvgRate) && dprLog.length > 0) {
    const totalQty = dprLog[dprLog.length-1].curr;
    const sumHrs   = dprLog.reduce((a,e) => a + (e.diffHours||0), 0);
    overallAvgRate = sumHrs > 0 ? totalQty / sumHrs : dprLog.reduce((a,e)=>a+e.rate,0)/dprLog.length;
  }

  const remain = Math.max(plan - curr, 0);

  // Show result box
  resBox.style.display = 'block';
  res24h.textContent   = fmt(qtyPeriod) + ' MT' + (isNaN(diffHours) ? '' : ' (' + diffHours.toFixed(1) + ' hrs)');
  resRate.textContent  = isNaN(periodRate) ? '—' : periodRate.toFixed(2) + ' MT/HR';
  resRem.textContent   = fmt(remain) + ' MT';

  setText('dpr-sc-24h',  fmt(qtyPeriod));
  setText('dpr-sc-rate', isNaN(overallAvgRate) ? (isNaN(periodRate) ? '—' : periodRate.toFixed(2)) : overallAvgRate.toFixed(2));

  updateDPRETA(isNaN(periodRate) ? overallAvgRate : periodRate, remain, plan);
  scheduleAutoSave();
}

function updateDPRETA(rate, remain, plan) {
  const etaRem  = document.getElementById('dpr-eta-rem');
  const etaRate = document.getElementById('dpr-eta-rate');
  const etaHrs  = document.getElementById('dpr-eta-hrs');
  const etaDt   = document.getElementById('dpr-eta-dt');

  if (!etaRem || !etaRate || !etaHrs || !etaDt) return;
  if (isNaN(rate) || rate <= 0 || isNaN(remain)) {
    etaRem.textContent  = '—';
    etaRate.textContent = '—';
    etaHrs.textContent  = '—';
    etaDt.textContent   = '—';
    return;
  }

  const remVal = Math.max(remain, 0);
  etaRem.textContent  = fmt(remVal) + ' MT';
  etaRate.textContent = rate.toFixed(2) + ' MT/HR';

  if (remVal === 0) {
    etaHrs.textContent = '0.00 HRS';
    etaDt.textContent  = 'LOADING COMPLETE';
    etaDt.style.color  = 'var(--green)';
    return;
  }

  const hrsToComplete = remVal / rate;
  etaHrs.textContent  = hrsToComplete.toFixed(2) + ' HRS';

  // Estimate completion date/time from current report date+time
  const dateEl = document.getElementById('dpr-date');
  const timeEl = document.getElementById('dpr-time');
  if (dateEl.value) {
    const [h, m]   = [(timeEl.value.slice(0,2)|0), (timeEl.value.slice(2,4)|0)];
    const base     = new Date(dateEl.value + 'T' + String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0') + ':00');
    const etaMs    = base.getTime() + hrsToComplete * 3600 * 1000;
    const etaDate  = new Date(etaMs);
    const dd = String(etaDate.getDate()).padStart(2,'0');
    const mm = String(etaDate.getMonth()+1).padStart(2,'0');
    const yy = etaDate.getFullYear();
    const hh = String(etaDate.getHours()).padStart(2,'0');
    const mn = String(etaDate.getMinutes()).padStart(2,'0');
    etaDt.textContent = `${dd}/${mm}/${yy} — ${hh}${mn} LT`;
    etaDt.style.color = 'var(--green)';
  } else {
    etaDt.textContent = hrsToComplete.toFixed(1) + ' hrs from now';
  }
}

function addDPREntry() {
  const prev = parseFloat(document.getElementById('dpr-prev').value);
  const curr = parseFloat(document.getElementById('dpr-curr').value);
  const plan = getN('tc-val');
  const date = document.getElementById('dpr-date').value;
  const time = document.getElementById('dpr-time').value;

  if (isNaN(curr)) {
    alert('Please enter Current total before adding to log.');
    return;
  }
  if (!isNaN(prev) && curr < prev) {
    alert('Error: Current total cannot be less than previous total.');
    return;
  }

  // Defensive: commenced must be set for accurate rate
  const startDateStr = (document.getElementById('dpr-start-date') || {}).value || '';
  const startTimeStr = (document.getElementById('dpr-start-time') || {}).value || '0000';
  const commencedDT  = parseDPRDateTime(startDateStr, startTimeStr);
  if (!commencedDT) {
    // WebView-safe: native confirm() is suppressed in Android WebView / iOS Safari
    _showDelConfirm(
      'Loading Commenced date/time is not set — period rate will be estimated. Continue?',
      function() { _addDPREntryCore(prev, curr, plan, date, time, commencedDT); },
      'CONTINUE', 'CANCEL'
    );
    return;
  }
  _addDPREntryCore(prev, curr, plan, date, time, commencedDT);
}

function _addDPREntryCore(prev, curr, plan, date, time, commencedDT) {
  // Current report DateTime
  const currentDT = parseDPRDateTime(date, time);

  // Previous DateTime: last entry ISO or commenced
  let prevDT = null;
  if (dprLog.length === 0) {
    prevDT = commencedDT;
  } else {
    const lastISO = dprLog[dprLog.length - 1].rawDateISO;
    prevDT = lastISO ? new Date(lastISO) : commencedDT;
  }

  // Period calc
  const qtyPeriod = isNaN(prev) ? curr : (curr - prev);
  let diffHours   = 0;
  let periodRate  = 0;

  if (currentDT && prevDT) {
    diffHours  = (currentDT - prevDT) / (1000 * 60 * 60);
    periodRate = diffHours > 0 ? qtyPeriod / diffHours : 0;
  } else {
    // Fallback to 24h if no timestamps
    diffHours  = 24;
    periodRate = qtyPeriod / 24;
  }

  // Overall avg rate
  let overallAvgRate = 0;
  if (commencedDT && currentDT) {
    const totalHrs = (currentDT - commencedDT) / (1000 * 60 * 60);
    overallAvgRate = totalHrs > 0 ? curr / totalHrs : periodRate;
  }

  const remain   = Math.max(plan - curr, 0);
  const dateDisp = date ? fmtDMY(date) : '—';

  const entry = {
    id:          Date.now(),
    date:        dateDisp,
    rawDateISO:  currentDT ? currentDT.toISOString() : '',
    time:        time,
    prev:        isNaN(prev) ? 0 : prev,
    curr:        curr,
    qtyPeriod:   qtyPeriod,
    diffHours:   diffHours,
    rate:        periodRate,
    overallRate: overallAvgRate,
    remain:      remain
  };

  dprLog.push(entry);
  renderDPRLog();
  scheduleAutoSave();

  // Auto-advance
  document.getElementById('dpr-prev').value = curr;
  document.getElementById('dpr-curr').value = '';
  calcDPR();
}

function deleteDPREntry(id) {
  dprLog = dprLog.filter(e => e.id !== id);
  renderDPRLog();
  scheduleAutoSave();
}

function clearDPRLog() {
  // WebView-safe: native confirm() is suppressed in Android WebView / iOS Safari
  _showDelConfirm('Clear all DPR log entries?', function() {
    dprLog = [];
    renderDPRLog();
    scheduleAutoSave();
  }, 'CLEAR', 'CANCEL');
}

function renderDPRLog() {
  const tbody    = document.getElementById('dpr-log-body');
  const totalsEl = document.getElementById('dpr-log-totals');

  if (dprLog.length === 0) {
    tbody.innerHTML = '<tr id="dpr-empty-row"><td colspan="7" style="text-align:center;padding:24px;font-family:var(--mono);font-size:0.75rem;color:var(--muted);letter-spacing:1px;">NO ENTRIES YET — ADD A DPR ENTRY TO BEGIN</td></tr>';
    totalsEl.style.display = 'none';
    return;
  }

  let html = '';
  dprLog.forEach((e, i) => {
    const rateColor = e.rate >= 1000 ? 'var(--green)' : e.rate >= 500 ? 'var(--accent)' : 'var(--text)';
    const hrsDisp   = e.diffHours ? e.diffHours.toFixed(1) + 'h' : '—';
    const qtyDisp   = e.qtyPeriod !== undefined ? e.qtyPeriod : (e.qty24h || 0);
    html += `<tr><td colspan="7"><div class="dpr-card">
      <div class="dpr-card-hdr">
        <span class="dpr-card-idx">${i+1}</span>
        <span class="dpr-card-date">${e.date}</span>
        <span class="dpr-card-time">${e.time} LT · ${hrsDisp}</span>
        <span class="dpr-card-del" onclick="deleteDPREntry(${e.id})" onmouseover="this.style.opacity='1'" onmouseout="this.style.opacity='0.6'">${ICO_CLOSE}</span>
      </div>
      <div class="dpr-card-grid">
        <div><div class="dpr-card-lbl">PREV</div><div class="dpr-card-val" style="color:var(--muted);">${fmt(e.prev)}</div></div>
        <div><div class="dpr-card-lbl">CURR</div><div class="dpr-card-val" style="color:var(--gold);font-weight:bold;">${fmt(e.curr)}</div></div>
        <div><div class="dpr-card-lbl" style="color:var(--green);">PERIOD</div><div class="dpr-card-val" style="color:var(--green);font-weight:bold;">${fmt(qtyDisp)}</div></div>
      </div>
      <div class="dpr-card-rate">
        <span class="dpr-card-lbl" style="margin-bottom:0;">RATE</span>
        <span class="dpr-card-val" style="color:${rateColor};">${e.rate.toFixed(2)} MT/HR</span>
      </div>
      </div></td></tr>`;
  });
  tbody.innerHTML = html;

  // ── Totals: use mathematically correct overall avg rate ─────────────────
  const totalLoaded = dprLog[dprLog.length - 1].curr;
  const lastPeriod  = dprLog[dprLog.length - 1].qtyPeriod !== undefined
                      ? dprLog[dprLog.length - 1].qtyPeriod
                      : (dprLog[dprLog.length - 1].qty24h || 0);
  // Overall avg = total loaded / total hours elapsed (from last entry overallRate if available)
  const overallAvgRate = dprLog[dprLog.length - 1].overallRate
    || (function() {
         const totalHrs = dprLog.reduce((a,e) => a + (e.diffHours||0), 0);
         return totalHrs > 0 ? totalLoaded / totalHrs
                             : dprLog.reduce((a,e)=>a+e.rate,0)/dprLog.length;
       })();

  setText('dpr-log-last24h',      fmt(lastPeriod) + ' MT');
  setText('dpr-log-total-loaded', fmt(totalLoaded) + ' MT');
  setText('dpr-log-avg-rate',     overallAvgRate.toFixed(2) + ' MT/HR');
  window._dprAvgRate = overallAvgRate; // shared with WeChat output
  setText('dpr-log-count',        dprLog.length);

  // ── ETA in DPR Log History footer ────────────────────────────────────────
  const logEtaHrsEl = document.getElementById('dpr-log-eta-hrs');
  const logEtaDtEl  = document.getElementById('dpr-log-eta-dt');
  const etaPlan     = getN('tc-val');
  const etaRemain   = Math.max(etaPlan - totalLoaded, 0);

  if (overallAvgRate > 0 && etaRemain > 0 && logEtaHrsEl && logEtaDtEl) {
    // Hours to complete
    const etaHours = etaRemain / overallAvgRate;

    // ETA datetime: start from last log entry timestamp if available
    const lastISO    = dprLog[dprLog.length - 1].rawDateISO;
    const baseDate   = lastISO ? new Date(lastISO) : new Date();
    const etaMs      = baseDate.getTime() + etaHours * 3600 * 1000;
    const etaDate    = new Date(etaMs);

    // Format hours
    const hrsWhole = Math.floor(etaHours);
    const hrsDec   = etaHours.toFixed(2);
    logEtaHrsEl.textContent = hrsDec + ' HRS';

    // Days to complete breakdown: X days Y hrs Z mins
    var totalMins   = Math.round(etaHours * 60);
    var etaDays     = Math.floor(totalMins / 1440);
    var etaHrsRem   = Math.floor((totalMins % 1440) / 60);
    var etaMinsRem  = totalMins % 60;
    var daysStr = '';
    if (etaDays > 0)    daysStr += etaDays + ' day' + (etaDays !== 1 ? 's' : '') + ' ';
    if (etaHrsRem > 0)  daysStr += etaHrsRem + ' hr' + (etaHrsRem !== 1 ? 's' : '') + ' ';
    daysStr += etaMinsRem + ' min' + (etaMinsRem !== 1 ? 's' : '');
    var logEtaDaysEl = document.getElementById('dpr-log-eta-days');
    if (logEtaDaysEl) logEtaDaysEl.textContent = daysStr.trim();

    // Format date/time: DD/MM/YYYY — HHMM LT
    const dd   = String(etaDate.getDate()).padStart(2,'0');
    const mm   = String(etaDate.getMonth()+1).padStart(2,'0');
    const yyyy = etaDate.getFullYear();
    const hh   = String(etaDate.getHours()).padStart(2,'0');
    const min  = String(etaDate.getMinutes()).padStart(2,'0');
    logEtaDtEl.textContent = dd+'/'+mm+'/'+yyyy+' — '+hh+min+' LT';

    document.getElementById('dpr-log-eta-block').style.display = 'flex';
  } else if (etaRemain <= 0 && logEtaHrsEl && logEtaDtEl) {
    logEtaHrsEl.textContent = '0.00 HRS';
    var dEl = document.getElementById('dpr-log-eta-days');
    if (dEl) dEl.textContent = '0 days 0 hrs 0 mins';
    logEtaDtEl.textContent  = 'LOADING COMPLETE';
  } else if (logEtaHrsEl && logEtaDtEl) {
    logEtaHrsEl.textContent = '—';
    var dEl2 = document.getElementById('dpr-log-eta-days');
    if (dEl2) dEl2.textContent = '—';
    logEtaDtEl.textContent  = '—';
  }

  const voyVal = (document.getElementById('voy-header') || document.getElementById('voy') || {}).value || '';
  const badge  = document.getElementById('dpr-log-voy-badge');
  if (badge) {
    if (voyVal.trim()) { setIconText(badge, ICO_ANCHOR, 'VOY ' + voyVal.trim()); } else { badge.textContent = ''; }
    badge.style.display = voyVal.trim() ? 'inline-block' : 'none';
  }

  const plan = getN('tc-val');
  setText('dpr-sc-current', fmt(totalLoaded));
  setText('dpr-sc-24h',     fmt(lastPeriod));
  setText('dpr-sc-rate',    overallAvgRate.toFixed(2));
  setText('dpr-sc-remain',  fmt(Math.max(plan - totalLoaded, 0)));
  totalsEl.style.display = 'block';
}

// ========================================
// COPY DPR REPORT TO CLIPBOARD
// ========================================
function copyDPRReport() {
  if (dprLog.length === 0) {
    alert('No DPR entries to copy.');
    return;
  }

  const voyVal   = (document.getElementById('voy-header') || document.getElementById('voy') || {}).value || '';
  const planVal  = getN('tc-val');
  const totalLoaded = dprLog[dprLog.length - 1].curr;
  const lastEntry = dprLog[dprLog.length - 1];
  const last24h = lastEntry.qtyPeriod !== undefined ? lastEntry.qtyPeriod : (lastEntry.qty24h || 0);
  const avgRate     = dprLog.reduce((a, e) => a + e.rate, 0) / dprLog.length;
  const remaining   = Math.max(planVal - totalLoaded, 0);

  const sep = '─────────────────────────';
  let lines = [];

  lines.push('📋 DPR LOG REPORT');
  if (voyVal.trim()) lines.push('VOYAGE: ' + voyVal.trim());
  lines.push(sep);

  // Header row
  lines.push('#  DATE          PREV(MT)    CURR(MT)  PERIOD(MT)  HRS   MT/HR');
  lines.push(sep);

  dprLog.forEach((e, i) => {
    const num    = String(i + 1).padEnd(3);
    const date   = (e.date + ' ' + e.time + 'LT').padEnd(16);
    const prev   = fmt(e.prev).padStart(10);
    const curr   = fmt(e.curr).padStart(10);
    const period = fmt(e.qtyPeriod !== undefined ? e.qtyPeriod : (e.qty24h||0)).padStart(10);
    const hrs    = (e.diffHours ? e.diffHours.toFixed(1) : '—').padStart(5);
    const rate   = e.rate.toFixed(2).padStart(9);
    lines.push(num + date + prev + curr + period + hrs + rate);
  });

  lines.push(sep);
  lines.push('LOADED (PERIOD) : ' + fmt(last24h)      + ' MT');
  lines.push('TOTAL LOADED    : ' + fmt(totalLoaded)  + ' MT');
  lines.push('CARGO PLAN      : ' + fmt(planVal)      + ' MT');
  lines.push('CARGO REMAIN    : ' + fmt(remaining)    + ' MT');
  lines.push('AVG RATE (ALL)  : ' + avgRate.toFixed(2) + ' MT/HR');
  lines.push('ENTRIES         : ' + dprLog.length);
  lines.push(sep);

  const text = lines.join('\n');

  navigator.clipboard.writeText(text).then(() => {
    const btn = document.querySelector('[onclick="copyDPRReport()"]');
    if (btn) {
      const orig = btn.textContent;
      setIconText(btn, ICO_CHECK, 'COPIED!');
      btn.style.color = 'var(--green)';
      btn.style.borderColor = 'var(--green)';
      setTimeout(() => {
        btn.textContent = orig;
        btn.style.color = '';
        btn.style.borderColor = '';
      }, 2000);
    }
  }).catch(() => {
    // Fallback for older browsers
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    alert('Report copied to clipboard!');
  });
}

// EXPORT DPR LOG AS CSV
// ========================================
function exportDPRCSV() {
  if (dprLog.length === 0) {
    alert('No DPR entries to export.');
    return;
  }

  const voyVal  = (document.getElementById('voy-header') || document.getElementById('voy') || {}).value || '';
  const planVal = getN('tc-val');
  const totalLoaded = dprLog[dprLog.length - 1].curr;
  const lastEntry = dprLog[dprLog.length - 1];
  const last24h = lastEntry.qtyPeriod !== undefined ? lastEntry.qtyPeriod : (lastEntry.qty24h || 0);
  const avgRate     = dprLog.reduce((a, e) => a + e.rate, 0) / dprLog.length;
  const remaining   = Math.max(planVal - totalLoaded, 0);

  const rows = [];

  // Meta header rows
  if (voyVal.trim()) rows.push(['VOYAGE', voyVal.trim()]);
  rows.push(['CARGO PLAN (MT)', planVal.toFixed(2)]);
  rows.push([]);

  // Column headers
  rows.push(['#', 'DATE', 'TIME', 'PREV (MT)', 'CURR (MT)', 'PERIOD (MT)', 'HRS', 'MT/HR']);

  // Data rows
  dprLog.forEach((e, i) => {
    const qtyP = e.qtyPeriod !== undefined ? e.qtyPeriod : (e.qty24h||0);
    rows.push([i + 1, e.date, e.time + ' LT', e.prev.toFixed(2), e.curr.toFixed(2), qtyP.toFixed(2), (e.diffHours||0).toFixed(1), e.rate.toFixed(2)]);
  });

  // Summary rows
  rows.push([]);
  rows.push(['LOADED (PERIOD) (MT)', last24h.toFixed(2)]);
  rows.push(['TOTAL LOADED (MT)',    totalLoaded.toFixed(2)]);
  rows.push(['CARGO REMAIN (MT)',    remaining.toFixed(2)]);
  rows.push(['AVG RATE (MT/HR)',     avgRate.toFixed(2)]);
  rows.push(['ENTRIES',             dprLog.length]);

  // Build CSV string
  const csv = rows.map(r => r.map(cell => {
    const s = String(cell === undefined ? '' : cell);
    return s.includes(',') || s.includes('"') || s.includes('\n') ? '"' + s.replace(/"/g, '""') + '"' : s;
  }).join(',')).join('\r\n');

  // Build filename
  const today = new Date();
  const dd = String(today.getDate()).padStart(2,'0');
  const mm = String(today.getMonth()+1).padStart(2,'0');
  const yyyy = today.getFullYear();
  const voy  = voyVal.trim() ? '_VOY' + voyVal.trim().replace(/\s+/g,'') : '';
  const filename = 'DPR_LOG' + voy + '_' + dd + mm + yyyy + '.csv';

  // Android WebView: route through native save dialog
  if (window.AndroidBridge && typeof window.AndroidBridge.exportFile === 'function') {
    const csvB64 = btoa(unescape(encodeURIComponent(csv)));
    window.AndroidBridge.exportFile(filename, 'text/csv;charset=utf-8;', csvB64);
    return;
  }

  // iOS WKWebView: same problem, same fix — native share sheet via the ios-app-build bridge
  if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) {
    window.webkit.messageHandlers.iosBridge.postMessage({
      filename: filename,
      mime: 'text/csv;charset=utf-8;',
      base64: btoa(unescape(encodeURIComponent(csv)))
    });
    return;
  }

  // Trigger download
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href     = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// ═══════════════════════════════════════════════════════════════════
// FEATURE 1 — OVERALL CARGO PROGRESS BAR
// ═══════════════════════════════════════════════════════════════════
function stepSF(delta) {
  var inp = document.getElementById('sf-val');
  if (!inp) return;
  var current = parseFloat(inp.value) || 0;
  // Round to 1 decimal to avoid floating-point drift (e.g. 109.5 + 0.1 = 109.60000001)
  var next = Math.round((current + delta) * 10) / 10;
  if (next < 0) next = 0;
  inp.value = next;
  recalc();
}

// ─── SYNC GLOBAL SF → ALL 6 HOLDS ───────────────────────────────────────────
// Sets each hold-level SF input explicitly to the current global SF value,
// activates all OVERRIDE badges, then recalculates.
// Animation: button spin+glow, staggered green flash across all hold inputs.
function syncAllHoldSF(evt) {
  var globalSF = parseFloat((document.getElementById('sf-val') || {}).value) || 0;
  if (globalSF <= 0) return; // nothing sensible to sync

  // ── Button animation ──────────────────────────────────────────────────────
  var btn = document.getElementById('sf-sync-btn');
  if (btn) {
    // Remove then re-add class to restart animation on rapid taps
    btn.classList.remove('syncing');
    void btn.offsetWidth; // force reflow
    btn.classList.add('syncing');

    // Ripple effect
    var oldRipple = btn.querySelector('.sync-ripple');
    if (oldRipple) oldRipple.remove();
    var ripple = document.createElement('span');
    ripple.className = 'sync-ripple';
    btn.appendChild(ripple);
    setTimeout(function() { if (ripple.parentNode) ripple.remove(); }, 550);

    // Remove syncing class after animation completes
    setTimeout(function() { btn.classList.remove('syncing'); }, 620);
  }

  // ── Sync each hold SF with staggered green flash ──────────────────────────
  for (var n = 1; n <= 6; n++) {
    (function(holdN, delay) {
      setTimeout(function() {
        var inp   = document.getElementById('hsf' + holdN);
        var badge = document.getElementById('hsf-badge-' + holdN);
        if (!inp) return;

        inp.value = globalSF.toFixed(2);
        inp.style.color = ''; // restore gold

        // Activate OVERRIDE badge
        if (badge) badge.classList.add('active');

        // Staggered green flash on the hold input
        inp.style.transition = 'background 0.12s';
        inp.style.background = 'rgba(127,191,155,0.25)';
        setTimeout(function() { inp.style.background = ''; }, 320);
      }, delay);
    })(n, (n - 1) * 55); // 55 ms stagger between holds
  }

  // ── Recalc after last flash completes ────────────────────────────────────
  setTimeout(function() {
    recalc();
    if (typeof scheduleAutoSave === 'function') scheduleAutoSave();
  }, 6 * 55 + 50);
}
// ─────────────────────────────────────────────────────────────────────────────

function progColor(p){
  if (!isFinite(p)) p = 0; // NaN/Infinity would index s[NaN] and crash recalc
  p = Math.min(Math.max(p,0),100)/100;
  const s=[[37,99,235],[46,160,120],[34,197,94],[224,85,102],[235,55,55]];
  const seg=p*(s.length-1), i=Math.min(Math.floor(seg),s.length-2), t=seg-i, a=s[i], b=s[i+1];
  return 'rgb('+Math.round(a[0]+(b[0]-a[0])*t)+','+Math.round(a[1]+(b[1]-a[1])*t)+','+Math.round(a[2]+(b[2]-a[2])*t)+')';
}

function updateOverallProgressBar(loaded, plan) {
  // Guard: both must be valid positive numbers
  const safePlan   = (typeof plan   === 'number' && plan   > 0) ? plan   : 0;
  const safeLoaded = (typeof loaded === 'number' && loaded >= 0) ? loaded : 0;
  const pct    = safePlan > 0 ? Math.min((safeLoaded / safePlan) * 100, 100) : 0;
  const remain = Math.max(safePlan - safeLoaded, 0);
  // Override with guard names for rest of function
  const plan_   = safePlan;
  const loaded_ = safeLoaded;

  const bar  = document.getElementById('ovr-bar');
  const pctEl = document.getElementById('ovr-pct');
  const ldEl  = document.getElementById('ovr-ld');
  const rmEl  = document.getElementById('ovr-rm');
  const plEl  = document.getElementById('ovr-plan');

  if (bar)   bar.style.width = pct.toFixed(2) + '%';
  if (pctEl) pctEl.textContent = pct.toFixed(2) + '%';
  if (ldEl)  ldEl.textContent  = loaded_.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
  if (rmEl)  rmEl.textContent  = remain.toLocaleString('en-US',  {minimumFractionDigits:2, maximumFractionDigits:2});
  if (plEl)  plEl.textContent  = plan_.toLocaleString('en-US',   {minimumFractionDigits:2, maximumFractionDigits:2});

  // Color shift based on progress — solid blended color, blue(0%) → red(100%)
  if (bar)   bar.style.background = progColor(pct);
  if (pctEl) pctEl.style.color = progColor(pct);
}

// ═══════════════════════════════════════════════════════════════════
// FEATURE 2 — HOLD COLOR-CODING BY FILL LEVEL
// ═══════════════════════════════════════════════════════════════════
function getHoldState(pct) {
  if (pct <= 0)    return 'empty';
  if (pct <  30)   return 'low';
  if (pct <  70)   return 'mid';
  if (pct <  99.9) return 'high';
  return 'full';
}

function applyHoldColorCoding(n, pct) {
  const state = getHoldState(pct);
  const stateClass = 'hold-state-' + state;
  const allStates = ['hold-state-empty','hold-state-low','hold-state-mid','hold-state-high','hold-state-full'];

  // HEIGHT tab card
  const hcard = document.getElementById('hcard-' + n);
  if (hcard) {
    allStates.forEach(s => hcard.classList.remove(s));
    hcard.classList.add(stateClass);
  }

  // STOW tab card — find by position (stow cards don't have numbered IDs)
  const stowCards = document.querySelectorAll('.stow-hold-card');
  // stow cards are rendered 6→1, so index = 6-n
  const stowCard = stowCards[6 - n];
  if (stowCard) {
    allStates.forEach(s => stowCard.classList.remove(s));
    stowCard.classList.add(stateClass);
  }

  // Height bar color
  // Height + stow bar color and percent label — blended blue→red by fill %
  const _col = progColor(pct);
  const hbar = document.getElementById('hbar-' + n);
  if (hbar) hbar.style.setProperty('background', _col, 'important');
  const sbar = document.getElementById('sbar-' + n);
  if (sbar) sbar.style.setProperty('background', _col, 'important');
  const hlbl = document.getElementById('hst-h' + n);
  if (hlbl) hlbl.style.color = _col;
  // Fill % label (mobile) follows its progress-bar color, both modes
  const clbl = document.getElementById('r-cratio-' + n);
  if (clbl) clbl.style.setProperty('color', _col, 'important');
  // STOW tab bar percent label follows its progress-bar color, both modes
  const spct = document.getElementById('spct-' + n);
  if (spct) spct.style.setProperty('color', _col, 'important');
  // Light mode: cargo-height input number follows its progress-bar color
  const hInp = document.getElementById('h' + n);
  if (hInp) {
    if (document.body.classList.contains('light-mode')) {
      hInp.style.setProperty('color', _col, 'important');
    } else {
      hInp.style.removeProperty('color');
    }
  }
  // ROUNDED LOADING input (STOW tab) follows the progress-bar color, both modes
  const rndInp = document.getElementById('rnd' + n);
  if (rndInp) rndInp.style.setProperty('color', _col, 'important');

  if (splEl) splEl.style.setProperty('color', _col, 'important');
}

// ═══════════════════════════════════════════════════════════════════
// FEATURE 4 — ANIMATED NUMBER COUNTERS + VALUE PULSE
// ═══════════════════════════════════════════════════════════════════
function animateValue(el, targetNum, decimals, prefix, suffix) {
  if (!el) return;
  const start = parseFloat(el.dataset.lastVal) || 0;
  const end   = targetNum;
  if (Math.abs(end - start) < 0.001) return; // no change
  el.dataset.lastVal = end;

  const duration = 380; // ms
  const startTime = performance.now();

  function step(now) {
    const elapsed = now - startTime;
    const progress = Math.min(elapsed / duration, 1);
    // Ease-out cubic
    const eased = 1 - Math.pow(1 - progress, 3);
    const current = start + (end - start) * eased;
    const formatted = current.toLocaleString('en-US', {
      minimumFractionDigits: decimals,
      maximumFractionDigits: decimals
    });
    el.innerHTML = '<span class="num-roll">' + (prefix||'') + formatted + (suffix||'') + '</span>';
    if (progress < 1) requestAnimationFrame(step);
    else el.innerHTML = (prefix||'') + formatted + (suffix||'');
  }
  requestAnimationFrame(step);
}

function pulseEl(id) {
  const el = document.getElementById(id);
  if (!el) return;
  el.classList.remove('val-pulse');
  void el.offsetWidth; // reflow to restart animation
  el.classList.add('val-pulse');
  setTimeout(() => el.classList.remove('val-pulse'), 500);
}

// ═══════════════════════════════════════════════════════════════════
// SAVE TO DAILY LOG — writes WeChat report data into LOG tab cells
// ═══════════════════════════════════════════════════════════════════
function saveToLog(time) {
  // ── DAILY_ROWS index map (must match expanded DAILY_ROWS array order):
  // 0:CH.1  1:CH.2  2:CH.3  3:CH.4  4:CH.5  5:CH.6  6:Heeling P/S
  // 7:Df    8:Dm    9:Da    10:Draft P/S
  // 11:Loaded(MT)  12:Avg Rate  13:Remain  14:Plan  15:Trim  16:HOG/SAG  17:Heel

  // ── 1. Time label for this slot
  // Read the user-editable time input (same logic as buildWeChatMsg)
  // so that if user changed e.g. "0530" → "0700", the log stores "0700LT"
  const timeInp    = document.getElementById('wc' + time + '-time');
  const editedTime = (timeInp && timeInp.value.trim()) ? timeInp.value.trim() : time;
  const timeLabel  = editedTime + 'LT';

  // ── 2. Get WeChat date → match or create log column
  const dateInp = document.getElementById('wc' + time + '-date');
  const dateStr = dateInp ? dateInp.value : '';
  if (!dateStr) {
    alert('Please set a date for the ' + time + ' LT report before saving to log.');
    return;
  }

  // Ensure dailyTimesPerDate is initialised
  if (!window.dailyTimesPerDate) window.dailyTimesPerDate = [];

  // Find or create date column
  let di = dailyDates.indexOf(dateStr);
  if (di === -1) {
    dailyDates.push(dateStr);
    di = dailyDates.length - 1;
    window.dailyTimesPerDate[di] = [];
  }
  if (!window.dailyTimesPerDate[di]) window.dailyTimesPerDate[di] = [];

  // Find or add time slot for this date
  let ti = window.dailyTimesPerDate[di].indexOf(timeLabel);
  if (ti === -1) {
    window.dailyTimesPerDate[di].push(timeLabel);
    ti = window.dailyTimesPerDate[di].length - 1;
  }

  // Rebuild table to reflect any new date/time columns
  renderDailyTable();

  // ── 3. Cargo heights (CH.1–CH.6 from HEIGHT tab inputs)
  //        Also read rounded MT from stowage plan inputs (rnd1-rnd6)
  const holdHeights = {};
  const holdMT      = {};
  [1,2,3,4,5,6].forEach(function(n) {
    const htInp = document.getElementById('h' + n);
    const mtInp = document.getElementById('rnd' + n);
    holdHeights[n] = htInp ? (htInp.value || '') : '';
    holdMT[n]      = mtInp ? (mtInp.value || '') : '';
  });

  // ── 4. Draft values
  const dfEl = document.getElementById('draft-f');
  const dmEl = document.getElementById('draft-m');
  const daEl = document.getElementById('draft-a');
  const df = dfEl ? dfEl.value : '';
  const dm = dmEl ? dmEl.value : '';
  const da = daEl ? daEl.value : '';

  // ── 5. Heeling height diff
  const heelingEl = document.getElementById('heel-diff');
  const heeling = heelingEl ? heelingEl.textContent.trim() : '';

  // ── 6. WeChat cargo summary fields
  // Read from the same source buildWeChatMsg() uses
  const loadedEl  = document.getElementById('ch-disc');
  const remainEl  = document.getElementById('ch-remain');
  const planInp   = document.getElementById('tc-val');
  const loaded    = loadedEl  ? loadedEl.textContent.trim()  : '';
  const remain    = remainEl  ? remainEl.textContent.trim()  : '';
  const plan      = planInp   ? planInp.value                : '';

  // Avg rate from DPR log (window._dprAvgRate set by renderDPRLog)
  const avgRate   = (typeof window._dprAvgRate === 'number')
                    ? window._dprAvgRate.toFixed(2) + ' MT/HR' : '';

  // Trim, HOG/SAG, Heel from window globals set by recalcStowage
  const trimLine  = (document.getElementById('trim-val')  || {}).textContent || '';
  const trimCond  = (document.getElementById('trim-cond') || {}).textContent || '';
  const trim      = trimLine ? trimLine + ' ' + trimCond : '';
  const hogSag    = window._hogSagLine  || '';
  const heel      = window._heelLine    || '';

  // ── 7. Build rowData map → ri → value
  // DAILY_ROWS = ['CH.1','CH.2','CH.3','CH.4','CH.5','CH.6',
  //   'Heeling P/S','Df','Dm','Da','Draft P/S',
  //   'Loaded (MT)','Avg Rate (MT/HR)','Remain (MT)','Plan (MT)',
  //   'Trim','HOG/SAG','Heel']
  const rowData = {
    0:  holdHeights[1],  // CH.1
    1:  holdHeights[2],  // CH.2
    2:  holdHeights[3],  // CH.3
    3:  holdHeights[4],  // CH.4
    4:  holdHeights[5],  // CH.5
    5:  holdHeights[6],  // CH.6
    6:  heeling,         // Heeling P/S
    7:  df,              // Df
    8:  dm,              // Dm
    9:  da,              // Da
    10: loaded,          // Loaded (MT)
    11: avgRate,         // Avg Rate (MT/HR)
    12: remain,          // Remain (MT)
    13: plan,            // Plan (MT)
    14: trim,            // Trim
    15: hogSag,          // HOG/SAG
    16: heel             // Heel
  };

  // Write into the persistent data store (keyed by date|time|ri)
  // This survives renderDailyTable() rebuilds — no more data loss
  if (!window.dailyData) window.dailyData = {};
  let filledCount = 0;
  Object.entries(rowData).forEach(function([ri, val]) {
    if (!val || val === '—') return;
    const key = dateStr + '|' + timeLabel + '|' + ri;
    window.dailyData[key] = val;
    filledCount++;
  });
  // Also store hold MT values with separate mt-N keys
  [1,2,3,4,5,6].forEach(function(n) {
    if (holdMT[n]) {
      window.dailyData[dateStr + '|' + timeLabel + '|mt-' + n] = holdMT[n];
    }
  });

  // Rebuild table — data is restored from window.dailyData, not lost
  renderDailyTable();
  scheduleAutoSave();

  // ── 8. Animate button
  const btn = document.getElementById('save-log-btn-' + time);
  if (btn) {
    const orig = btn.innerHTML;
    setIconText(btn, ICO_CHECK, 'SAVED');
    btn.classList.add('saved');
    setTimeout(function() {
      btn.innerHTML = orig;
      btn.classList.remove('saved');
    }, 1600);
  }

  // ── 9. Flash feedback
  const msg = document.getElementById('copy-msg');
  if (msg) {
    msg.style.color = 'var(--accent)';
    setIconText(msg, ICO_CHECK, time + 'LT DATA SAVED TO LOG (' + filledCount + ' fields)');
    msg.style.display = 'inline-flex';
    clearTimeout(window._copyTimer);
    window._copyTimer = setTimeout(function() {
      msg.style.display = 'none';
      msg.style.color = 'var(--green)';
    }, 2500);
  }
}


// ═══════════════════════════════════════════════════════════════════
// HEEL LIST SELECTOR
// Range: -5.0 to +5.0 in 0.1 steps (101 positions)
// Negative = PORT heel, Positive = STARBOARD heel, 0 = EVEN KEEL
// ═══════════════════════════════════════════════════════════════════
(function() {
  // Build the list: -5.0, -4.9, ... -0.1, 0.0, +0.1, ... +5.0
  var HEEL_LIST = [];
  for (var i = -50; i <= 50; i++) {
    HEEL_LIST.push(Math.round(i * 10) / 100);  // -5.0 to +5.0
  }
  // Start at 0.0
  var heelIdx = HEEL_LIST.indexOf(0);

  function updateHeelDisplay(direction) {
    var val  = HEEL_LIST[heelIdx];
    var valEl  = document.getElementById('heel-list-val');
    var sideEl = document.getElementById('heel-list-side');
    if (!valEl || !sideEl) return;

    // Format value
    var sign   = val > 0 ? '+' : '';
    var label  = val.toFixed(1) + '°';  // degree symbol
    valEl.textContent = sign + label;

    // Color + side label
    valEl.className = 'heel-val ' +
      (val > 0.04 ? 'stbd-heel' : val < -0.04 ? 'port-heel' : 'even-heel');
    sideEl.textContent = val > 0.04 ? 'STBD' : val < -0.04 ? 'PORT' : 'EVEN KEEL';

    // Slide animation
    if (direction !== 0) {
      var animClass = direction > 0 ? 'heel-slide-right' : 'heel-slide-left';
      valEl.classList.remove('heel-slide-right', 'heel-slide-left');
      void valEl.offsetWidth;
      valEl.classList.add(animClass);
      setTimeout(function() { valEl.classList.remove(animClass); }, 280);
    }

    // Store for WeChat output
    var sideText = val > 0.04 ? 'STBD' : val < -0.04 ? 'PORT' : 'EVEN KEEL';
    window._heelLine = 'Heel: ' + sign + label + ' (' + sideText + ')';
    window._heelVal  = sign + label;

    // Trigger WeChat preview refresh
    if (typeof updateWeChatPreviews === 'function') updateWeChatPreviews();

    // ── Sync to Heel Angle input (Heeling Calculator) with pulse animation ──
    var heelInp = document.getElementById('heel-angle');
    if (heelInp) {
      var absVal = Math.abs(val);
      var prevVal = parseFloat(heelInp.value) || 0;
      heelInp.value = absVal.toFixed(1);

      // Animate only when value actually changed and direction was intentional
      if (direction !== 0 && Math.abs(absVal - prevVal) > 0.001) {
        heelInp.classList.remove('heel-inp-pulse');
        void heelInp.offsetWidth; // reflow
        heelInp.classList.add('heel-inp-pulse');
        setTimeout(function() { heelInp.classList.remove('heel-inp-pulse'); }, 420);
      }

      // ── Sync sign button (+/−) to match heel selector direction ──────────
      var signBtn = document.getElementById('heel-sign-btn');
      if (signBtn) {
        if (val > 0.04) {
          // Positive = STBD — cyan
          signBtn.setAttribute('data-sign', '1');
          signBtn.textContent = '+';
          signBtn.style.borderColor = 'rgba(127,163,194,0.45)';
          signBtn.style.background  = 'rgba(127,163,194,0.08)';
          signBtn.style.color       = 'var(--accent)';
        } else if (val < -0.04) {
          // Negative = PORT — amber/gold
          signBtn.setAttribute('data-sign', '-1');
          signBtn.textContent = '−';
          signBtn.style.borderColor = 'rgba(184,192,200,0.45)';
          signBtn.style.background  = 'rgba(184,192,200,0.08)';
          signBtn.style.color       = 'var(--gold)';
        } else {
          // Even keel — muted
          signBtn.setAttribute('data-sign', '1');
          signBtn.textContent = '+';
          signBtn.style.borderColor = 'rgba(127,163,194,0.35)';
          signBtn.style.background  = 'rgba(127,163,194,0.05)';
          signBtn.style.color       = 'var(--muted)';
        }
      }

      // Trigger heeling recalc so all downstream values update
      if (typeof recalcStowage === 'function') recalcStowage();
    }
  }

  window.stepHeel = function(dir) {
    var next = heelIdx + dir;
    if (next < 0) next = 0;
    if (next >= HEEL_LIST.length) next = HEEL_LIST.length - 1;
    heelIdx = next;
    updateHeelDisplay(dir);
    if (typeof scheduleAutoSave === 'function') scheduleAutoSave();
  };

  // Init on page load
  document.addEventListener('DOMContentLoaded', function() {
    updateHeelDisplay(0);
  });
  // Also init immediately in case DOM already loaded
  if (document.readyState !== 'loading') updateHeelDisplay(0);
})();

// ═══════════════════════════════════════════════════════════════════
// DPR TIME STEPPER — fine-grain any minute of the day
// Format: 4-digit 24h string e.g. "0612", "1347", "2315"
// ◄ decreases by 1 min, ► increases by 1 min
// Handles 0000 floor and 2359 ceiling (2400 not allowed as it breaks
// parseDPRDateTime — user should use 0000 of the next day instead)
// ═══════════════════════════════════════════════════════════════════
function parseDPRTimeStr(str) {
  // Accepts "0612", "6:12", "612" → normalises to { h, m } or null
  var s = (str || '').replace(/[^0-9]/g, '').padStart(4, '0').slice(-4);
  var h = parseInt(s.slice(0, 2), 10);
  var m = parseInt(s.slice(2, 4), 10);
  if (isNaN(h) || isNaN(m)) return null;
  // Clamp
  h = Math.min(h, 23);
  m = Math.min(m, 59);
  return { h: h, m: m };
}

function toDPRTimeStr(h, m) {
  return String(h).padStart(2,'0') + String(m).padStart(2,'0');
}

function stepDPRTime(id, delta) {
  var el = document.getElementById(id);
  if (!el) return;
  var t = parseDPRTimeStr(el.value) || { h: 0, m: 0 };
  var totalMins = t.h * 60 + t.m + delta;
  // Wrap: 0000−1 → 2359, 2359+1 → 0000
  totalMins = ((totalMins % 1440) + 1440) % 1440;
  var nh = Math.floor(totalMins / 60);
  var nm = totalMins % 60;
  el.value = toDPRTimeStr(nh, nm);
  calcDPR();
  if (typeof scheduleAutoSave === 'function') scheduleAutoSave();
}

function fmtDPRTimeInp(el) {
  // Strip non-digits while typing; keep up to 4 digits
  var raw = el.value.replace(/[^0-9]/g, '');
  if (raw.length > 4) raw = raw.slice(-4);
  el.value = raw;
}

function normDPRTimeInp(el) {
  // On blur, normalise to HHMM, clamp to 0000-2359
  var t = parseDPRTimeStr(el.value);
  if (!t) { el.value = '0000'; return; }
  el.value = toDPRTimeStr(t.h, t.m);
}

  if (typeof recalcStowage === 'function') recalcStowage();

}

// DAILY LOG: Remove a time slot column entirely (delete, not just clear)
// ═══════════════════════════════════════════════════════════════════
function removeDailyTimeSlot(di, ti) {
  if (!window.dailyTimesPerDate || !window.dailyTimesPerDate[di]) return;
  const d = dailyDates[di];
  const t = window.dailyTimesPerDate[di][ti];

  // iOS Safari suppresses confirm() from table cell onclick — use a DOM overlay instead
  _showDelConfirm(
    'Delete ' + t + ' on ' + fmtDMY(d) + '?',
    function() {
      // Confirmed: remove from persistent data store
      if (window.dailyData) {
        DAILY_ROWS.forEach(function(row, ri) {
          delete window.dailyData[d + '|' + t + '|' + ri];
        });
      }
      // Remove this time slot
      window.dailyTimesPerDate[di].splice(ti, 1);

      // Auto-delete the entire date column if no time slots remain
      if (window.dailyTimesPerDate[di].length === 0) {
        var autoDate = dailyDates[di];
        if (window.dailyData && autoDate) {
          Object.keys(window.dailyData).forEach(function(key) {
            if (key.indexOf(autoDate + '|') === 0) delete window.dailyData[key];
          });
        }
        window.dailyTimesPerDate.splice(di, 1);
        dailyDates.splice(di, 1);
      }

      renderDailyTable();
      scheduleAutoSave();
    }
  );
}

// ═══════════════════════════════════════════════════════════════════
// HOLD-LEVEL SF STEPPER — stepHoldSF(holdNum, delta)
// Ported from Discharge app. Identical logic.
// delta: ±1 (coarse) or ±0.01 (fine)
// Centre input #hsfN is both display and data store.
// Empty/zero = use Global SF (placeholder shows "GLOBAL").
// ═══════════════════════════════════════════════════════════════════
function stepHoldSF(n, delta) {
  var inp   = document.getElementById('hsf' + n);
  var badge = document.getElementById('hsf-badge-' + n);
  if (!inp) return;

  var current  = parseFloat(inp.value) || 0;
  var globalSF = parseFloat((document.getElementById('sf-val') || {}).value) || 100;
  // Seed from Global SF when no override is set and user steps down
  var base = (current > 0) ? current : globalSF;

  // Round to 2 dp to avoid float drift
  var next = Math.round((base + delta) * 100) / 100;
  if (next < 0.01) next = 0.01;

  inp.value = next;
  inp.style.color = ''; // restore gold from any placeholder muted colour

  if (badge) badge.classList.add('active');

  // Flash animation on input
  inp.style.transition = 'background 0.12s';
  inp.style.background = delta > 0 ? 'rgba(127,191,155,0.18)' : 'rgba(207,139,151,0.15)';
  setTimeout(function() { inp.style.background = ''; }, 250);

  recalc();
  if (typeof scheduleAutoSave === 'function') scheduleAutoSave();
}

/** Called on manual keystroke inside a hold SF input */
function onHoldSFType(n) {
  var inp   = document.getElementById('hsf' + n);
  var badge = document.getElementById('hsf-badge-' + n);
  if (!inp) return;
  var v = parseFloat(inp.value) || 0;
  if (badge) badge.classList.toggle('active', v > 0);
  recalc();
  if (typeof scheduleAutoSave === 'function') scheduleAutoSave();
}

/** On blur: clamp to 2 dp and clear if zero/invalid */
function onHoldSFBlur(n) {
  var inp   = document.getElementById('hsf' + n);
  var badge = document.getElementById('hsf-badge-' + n);
  if (!inp) return;
  var v = parseFloat(inp.value) || 0;
  if (v > 0) {
    inp.value = v.toFixed(2);
    if (badge) badge.classList.add('active');
  } else {
    inp.value = '';
    if (badge) badge.classList.remove('active');
  }
  recalc();
  if (typeof scheduleAutoSave === 'function') scheduleAutoSave();
}

/** Called once on restore / init to sync display state */
function syncHoldSFDisplay(n) {
  var inp   = document.getElementById('hsf' + n);
  var badge = document.getElementById('hsf-badge-' + n);
  if (!inp) return;
  var v = parseFloat(inp.value) || 0;
  if (v > 0) {
    inp.value = v.toFixed(2);
    if (badge) badge.classList.add('active');
  } else {
    inp.value = '';
    if (badge) badge.classList.remove('active');
  }
}

// STOW PLAN LOCK — protects sp1–sp6 from accidental edits
// ═══════════════════════════════════════════════════════════════════
(function initSPLocks() {
  for (var n = 1; n <= 6; n++) {
    if (localStorage.getItem('sp' + n + '-locked') === '1') {
      _setSPLocked(n, true, true);
    }
  }
})();

function _setSPLocked(n, locked, silent) {
  var wrap = document.getElementById('sp' + n + '-wrap');
  var btn  = document.getElementById('sp' + n + '-lockbtn');
  var inp  = document.getElementById('sp' + n);
  if (!wrap || !btn || !inp) return;
  if (locked) {
    wrap.classList.add('is-locked');
    btn.innerHTML = ICO_LOCK;
    inp.readOnly = true;
  } else {
    wrap.classList.remove('is-locked');
    btn.innerHTML = ICO_UNLOCK;
    inp.readOnly = false;
  }
  if (!silent) localStorage.setItem('sp' + n + '-locked', locked ? '1' : '0');
}

function toggleSPLock(n) {
  var wrap = document.getElementById('sp' + n + '-wrap');
  if (!wrap) return;
  if (!wrap.classList.contains('is-locked')) {
    _setSPLocked(n, true);
  } else {
    tryUnlockSP(n);
  }
}

function tryUnlockSP(n) {
  var inp = document.getElementById('sp' + n);
  var val = inp ? inp.value : '—';
  _showDelConfirm(
    'Unlock STOW PLAN (Hold ' + n + ')?' + '\n\nCurrent: ' + val + ' MT\n\nTap UNLOCK to allow editing.',
    function() { _setSPLocked(n, false); },
    'UNLOCK',
    'CANCEL'
  );
}

// ═══════════════════════════════════════════════════════════════════
// WECHAT TIME INPUT — iOS KEYBOARD SCROLL FIX
// When the numeric keypad slides up on iOS, it can obscure the
// wc-time-input field. On focus, we wait 300ms for the keyboard
// animation to complete, then scroll the input into the centre of
// the visible viewport so the user can always see what they type.
// ═══════════════════════════════════════════════════════════════════
(function initWcTimeInputScrollFix() {
  function attachFix() {
    document.querySelectorAll('.wc-time-input').forEach(function(input) {
      input.addEventListener('focus', function() {
        var el = this;
        setTimeout(function() {
          el.scrollIntoView({ block: 'center', behavior: 'smooth' });
        }, 300);
      });
    });
  }

  // Attach after DOM is ready
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', attachFix);
  } else {
    attachFix();
  }
})();

</script>

// The save indicator is split so runtime text stays textContent.
function setSaveIndicator(icoHtml, text) {
  var ind = document.getElementById('save-indicator');
  if (!ind) return null;
  var ico = ind.querySelector('.si-ico'), txt = ind.querySelector('.si-txt');
  if (ico) ico.innerHTML = icoHtml || '';
  if (txt) txt.textContent = text;
  return ind;
}
// Renders <icon><text> into any status node. The icon html is always a static
// literal; the message stays textContent, so runtime data can never be markup.
function setIconText(el, icoHtml, text) {
  if (!el) return;
  el.innerHTML = '';
  el.style.display = 'inline-flex';
  el.style.alignItems = 'center';
  el.style.gap = '5px';
  if (icoHtml) { var i = document.createElement('span'); i.style.display = 'flex'; i.innerHTML = icoHtml; el.appendChild(i); }
  var t = document.createElement('span'); t.textContent = text; el.appendChild(t);
}
function getSaveIndicator() {
  var ind = document.getElementById('save-indicator');
  if (!ind) return { ico: '', txt: '' };
  var ico = ind.querySelector('.si-ico'), txt = ind.querySelector('.si-txt');
  return { ico: ico ? ico.innerHTML : '', txt: txt ? txt.textContent : '' };
}

// ───────────────────────────────────────────────────────────────────
// FOUC fix — apply saved theme BEFORE first paint
// Runs in <head> before body parses, so light-mode flips colors instantly
// without a navy flash. Wrapped in try/catch in case localStorage is blocked.
// ───────────────────────────────────────────────────────────────────
try {
  if (localStorage.getItem('cargo-theme') === 'light') {
    document.documentElement.classList.add('pre-light');
  }
} catch (e) { /* private mode / blocked storage — fall through to dark */ }

// Block pinch-zoom on iOS Safari (meta tag alone is not always respected)
document.addEventListener('gesturestart',  function(e){ e.preventDefault(); }, {passive:false});
document.addEventListener('gesturechange', function(e){ e.preventDefault(); }, {passive:false});
document.addEventListener('gestureend',    function(e){ e.preventDefault(); }, {passive:false});
// Block double-tap zoom and two-finger pinch via touchmove
document.addEventListener('touchmove', function(e){
  if (e.touches && e.touches.length > 1) e.preventDefault();
}, {passive:false});
// Block double-tap zoom delay on all tappable elements
var _lastTap = 0;
document.addEventListener('touchend', function(e){
  var now = Date.now();
  if (now - _lastTap < 300) e.preventDefault();
  _lastTap = now;
}, {passive:false});

<style>
:root{
  --navy:#101214; --deep:#15171a; --panel:#17191c; --border:#2a2e33;
  --accent:#7fa3c2; --accent2:#3d5a75; --gold:#b8c0c8; --green:#7fbf9b;
  --red:#cf8b97; --text:#dfe3e7; --muted:#8b929a;
  --mono:'JetBrains Mono',ui-monospace,'Courier New',monospace;
  --sans:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
  --nav-h:60px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;touch-action:manipulation;background:var(--navy);color:var(--text);font-family:var(--sans);}
/* FOUC prevention — html.pre-light flips background BEFORE body class is set by JS */
html.pre-light{background:#FFFFFF;}
html.pre-light body{background:#FFFFFF;color:#16181a;}

input, textarea, select{
  -webkit-user-select:text !important;
  user-select:text !important;
  touch-action:manipulation;
}
.app-shell{
  display:flex;flex-direction:column;
  height:100dvh;
  height:100vh;
  overflow:hidden;
  -webkit-user-select:none;user-select:none;
  background-image:
    radial-gradient(ellipse at 20% 10%,rgba(61,90,117,0.12) 0%,transparent 50%),
    radial-gradient(ellipse at 80% 90%,rgba(127,163,194,0.08) 0%,transparent 50%),
    repeating-linear-gradient(0deg,transparent,transparent 39px,rgba(42,46,51,0.12) 39px,rgba(42,46,51,0.12) 40px);
}
/* TOP BAR */
.top-bar{position:relative;z-index:90;flex-shrink:0;background:linear-gradient(180deg,rgba(21,23,26,0.99),rgba(16,18,20,0.98));border-bottom:1px solid var(--border);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding-top:0;}
.top-bar-main{display:flex;align-items:center;gap:8px;padding:10px 10px 8px;min-width:0;}
.ship-icon{width:32px;height:32px;fill:var(--accent);flex-shrink:0;filter:none;}
.header-title{font-size:clamp(0.9rem,4.2vw,1.45rem);font-weight:900;letter-spacing:clamp(1px,1vw,3px);text-transform:uppercase;color:#fff;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.header-sub{font-family:var(--mono);font-size:0.52rem;color:var(--accent);letter-spacing:2px;margin-top:2px;}
.top-bar-right{margin-left:auto;display:flex;align-items:center;gap:5px;flex-shrink:0;}

.hdr-tools{display:flex;align-items:center;gap:4px;flex-shrink:0;}

.hbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:38px;min-width:38px;padding:0 5px;border-radius:7px;border:1px solid var(--border);background:rgba(184,192,200,0.035);color:var(--muted);cursor:pointer;flex-shrink:0;-webkit-tap-highlight-color:transparent;transition:background .18s ease,border-color .18s ease,color .18s ease,transform .1s ease;}
.hbtn .hbtn-ico{line-height:1;}
.hbtn .hbtn-lbl{font-family:var(--mono);font-size:0.36rem;letter-spacing:1.3px;line-height:1;opacity:0.8;}
.hbtn:hover{background:rgba(184,192,200,0.09);border-color:rgba(184,192,200,0.42);color:var(--text);}
.hbtn:active{transform:scale(0.92);}

.hdr-action-row{display:flex;align-items:center;gap:4px;flex-shrink:0;}

.voy-bar{display:flex;align-items:center;gap:10px;padding:8px 14px;background:rgba(0,0,0,0.3);border-top:1px solid rgba(42,46,51,0.3);}

.voy-inp-main{flex:1;background:transparent;border:none;border-bottom:1px solid rgba(127,163,194,0.35);color:#fff;font-family:var(--mono);font-size:0.85rem;letter-spacing:2px;padding:3px 4px;outline:none;min-height:32px;}
/* LAYOUT */
.content-area{padding:12px;}
.tab-content{display:none;}
.tab-content.active{
  display:flex;flex-direction:column;flex:1;min-height:0;
  overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;
  padding-bottom:16px;
  animation:tabFadeSlide 0.32s cubic-bezier(0.25,0.46,0.45,0.94) forwards;
}
@keyframes tabFadeSlide{
  0%  {opacity:0;transform:translateY(14px);}
  100%{opacity:1;transform:translateY(0);}
}

/* ── BOTTOM NAV ─────────────────────────────────────────────────── */
.bottom-nav{
  flex-shrink:0;
  height:var(--nav-h);
  display:flex;
  background:linear-gradient(0deg,#0c0e10,var(--deep));
  border-top:1px solid var(--border);
  z-index:100;
  box-sizing:border-box;
}
.tab.nav-btn{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;cursor:pointer;color:var(--muted);background:transparent;
  font-family:var(--sans);border:none;padding:0;
  position:relative;min-height:44px;
  transition:color 0.2s, transform 0.15s cubic-bezier(0.34,1.56,0.64,1);
  touch-action:manipulation;-webkit-tap-highlight-color:transparent;
}
/* accent bar slides down from top on active */
.tab.nav-btn::before{
  content:'';position:absolute;top:0;left:15%;right:15%;height:2px;
  background:var(--accent);border-radius:0 0 2px 2px;
  opacity:0;transform:scaleX(0);
  transition:opacity 0.22s, transform 0.25s cubic-bezier(0.34,1.56,0.64,1);
}
.tab.nav-btn.active{color:var(--accent);}
.tab.nav-btn.active::before{opacity:1;transform:scaleX(1);}
.tab.nav-btn:active{transform:scale(0.86);transition:transform 0.1s;}
.nav-ico{font-size:1.25rem;line-height:1;pointer-events:none;transition:transform 0.2s cubic-bezier(0.34,1.56,0.64,1);}
.tab.nav-btn.active .nav-ico{transform:scale(1.12) translateY(-1px);}
.nav-lbl{font-size:0.48rem;letter-spacing:1.5px;font-weight:700;text-transform:uppercase;transition:color 0.2s;}

/* ── CARD STAGGER ANIMATION ─────────────────────────────────────── */
@keyframes cardRise{
  0%  {opacity:0;transform:translateY(18px);}
  100%{opacity:1;transform:translateY(0);}
}
.tab-content.active .card,
.tab-content.active .section,
.tab-content.active .summary-cards,
.tab-content.active .stow-totals-bar,
.tab-content.active .stow-hold-card{
  animation:cardRise 0.38s cubic-bezier(0.25,0.46,0.45,0.94) both;
}
.tab-content.active .card:nth-child(1),
.tab-content.active .section:nth-child(1),
.tab-content.active .stow-hold-card:nth-child(1){animation-delay:0.04s;}
.tab-content.active .card:nth-child(2),
.tab-content.active .section:nth-child(2),
.tab-content.active .stow-hold-card:nth-child(2){animation-delay:0.09s;}
.tab-content.active .card:nth-child(3),
.tab-content.active .section:nth-child(3),
.tab-content.active .stow-hold-card:nth-child(3){animation-delay:0.14s;}
.tab-content.active .card:nth-child(4),
.tab-content.active .stow-hold-card:nth-child(4){animation-delay:0.18s;}
.tab-content.active .card:nth-child(5),
.tab-content.active .stow-hold-card:nth-child(5){animation-delay:0.22s;}
.tab-content.active .card:nth-child(6),
.tab-content.active .stow-hold-card:nth-child(6){animation-delay:0.26s;}
.tab-content.active .summary-cards{animation-delay:0.03s;}
.tab-content.active .stow-totals-bar{animation-delay:0.0s;}

/* ── SUMMARY CARD COUNT-UP FLASH ────────────────────────────────── */
@keyframes sCardPop{

}
.scard-pop{animation:sCardPop 0.35s cubic-bezier(0.22,1,0.36,1);}

@keyframes navRipple{

.nav-ripple{

@keyframes valPulse{

.val-pulse{animation:valPulse 0.32s cubic-bezier(0.22,1,0.36,1);}

/* ── SCAN LINE — subtle CRT sweep on tab enter ───────────────────── */
@keyframes scanLine{

}
.tab-content.active::after{
  content:'';pointer-events:none;position:fixed;
  left:0;right:0;height:3px;
  background:linear-gradient(180deg,rgba(127,163,194,0.22),transparent);
