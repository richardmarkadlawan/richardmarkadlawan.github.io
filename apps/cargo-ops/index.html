// ========================================
function copyDPRReport() {
  if (!dprLog || dprLog.length === 0) {
    alert('No DPR log entries to copy.');
    return;
  }

  var plan     = getN('tc-val');
  var voyEl    = document.getElementById('voy-header');
  var voy      = voyEl ? voyEl.value.trim() : '';
  var sdEl     = document.getElementById('dpr-start-date');
  var stEl     = document.getElementById('dpr-start-time');
  var startDT  = (sdEl && sdEl.value) ? sdEl.value + ' ' + (stEl ? stEl.value : '0800') + 'LT' : '—';

  var lines = [];
  lines.push('=== DISCHARGING PROGRESS REPORT ===');
  if (voy)  lines.push('Voyage: ' + voy);
  lines.push('Commenced: ' + startDT);
  lines.push('Plan: ' + fmt(plan) + ' MT');
  lines.push('');
  lines.push('#  | Date/Time           | Prev(MT)   | Curr(MT)   | Period(MT) | Rate(MT/HR) | Hrs');
  lines.push('---|---------------------|------------|------------|------------|-------------|----');

  dprLog.forEach(function(e, i) {
    var num  = String(i+1).padEnd(3);
    var dt   = (e.date + ' ' + e.time + 'LT').padEnd(21);
    var prev = fmt(e.prev).padStart(10);
    var curr = fmt(e.curr).padStart(10);
    var qty  = fmt(e.qtyPeriod).padStart(10);
    var rate = e.rate.toFixed(2).padStart(11);
    var hrs  = (e.diffHours||0).toFixed(1).padStart(4);
    lines.push(num + '| ' + dt + '| ' + prev + ' | ' + curr + ' | ' + qty + ' | ' + rate + ' | ' + hrs);
  });

  var last         = dprLog[dprLog.length - 1];
  var currOnboard  = last.curr;
  var totalDisch   = dprLog.reduce(function(a,e){ return a + (e.qtyPeriod||0); }, 0);
  var totalHrs     = dprLog.reduce(function(a,e){ return a + (e.diffHours||0); }, 0);
  var overallRate  = totalHrs > 0 ? totalDisch / totalHrs : 0;
  var etaHrs       = overallRate > 0 ? currOnboard / overallRate : 0;

  lines.push('');
  lines.push('--- SUMMARY ---');
  lines.push('Total Discharged : ' + fmt(totalDisch) + ' MT');
  lines.push('Cargo Onboard    : ' + fmt(currOnboard) + ' MT');
  lines.push('Overall Avg Rate : ' + overallRate.toFixed(2) + ' MT/HR');
  lines.push('Est. Hours Rem.  : ' + etaHrs.toFixed(2) + ' HRS');
  lines.push('Entries          : ' + dprLog.length);

  var text = lines.join('\n');

  var btn = document.querySelector('[onclick="copyDPRReport()"]');
  function animBtn(icoHtml, msg) {
    if (!btn) return;
    var orig = btn.innerHTML;
    setIconText(btn, icoHtml, msg);
    setTimeout(function(){ btn.innerHTML = orig; }, 1800);
  }

  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function() {
      animBtn(ICO_CHECK, 'COPIED');
    }).catch(function() {
      _fallbackCopy(text);
      animBtn(ICO_CHECK, 'COPIED');
    });
  } else {
    _fallbackCopy(text);
    animBtn(ICO_CHECK, 'COPIED');
  }
}

function _fallbackCopy(text) {
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.cssText = 'position:fixed;top:-9999px;left:-9999px;opacity:0;';
  document.body.appendChild(ta);
  ta.select();
  ta.setSelectionRange(0, 99999);
  try { document.execCommand('copy'); } catch(e) {}
  document.body.removeChild(ta);
}

// ========================================
function exportDPRCSV() {
  if (!dprLog || dprLog.length === 0) {
    alert('No DPR log entries to export.');
    return;
  }

  var plan    = getN('tc-val');
  var voyEl   = document.getElementById('voy-header');
  var voy     = voyEl ? voyEl.value.trim() : '';
  var sdEl    = document.getElementById('dpr-start-date');
  var stEl    = document.getElementById('dpr-start-time');
  var startDT = (sdEl && sdEl.value) ? sdEl.value + 'T' + (stEl ? stEl.value.slice(0,2)+':'+stEl.value.slice(2) : '08:00') : '';

  var rows = [];
  // Header block
  rows.push(['CARGO DISCHARGE — DPR LOG']);
  rows.push(['Voyage', voy]);
  rows.push(['Plan (MT)', plan]);
  rows.push(['Commenced', startDT]);
  rows.push([]);
  // Column headers
  rows.push(['#','Date','Time (LT)','Prev Onboard (MT)','Curr Onboard (MT)',
             'Discharged Period (MT)','Hours','Rate (MT/HR)','Overall Avg Rate (MT/HR)','Remain (MT)']);

  dprLog.forEach(function(e, i) {
    rows.push([
      i+1,
      e.date || '',
      e.time || '',
      e.prev.toFixed(2),
      e.curr.toFixed(2),
      (e.qtyPeriod||0).toFixed(2),
      (e.diffHours||0).toFixed(2),
      e.rate.toFixed(2),
      (e.overallRate||0).toFixed(2),
      (e.remain||0).toFixed(2)
    ]);
  });

  // Summary footer
  var totalDisch  = dprLog.reduce(function(a,e){ return a+(e.qtyPeriod||0); }, 0);
  var totalHrs    = dprLog.reduce(function(a,e){ return a+(e.diffHours||0); }, 0);
  var overallRate = totalHrs > 0 ? totalDisch / totalHrs : 0;
  var last        = dprLog[dprLog.length - 1];
  rows.push([]);
  rows.push(['TOTALS','','',
    '','', totalDisch.toFixed(2), totalHrs.toFixed(2), overallRate.toFixed(2), '', last.curr.toFixed(2)]);

  // Build CSV string
  var csv = rows.map(function(row) {
    return row.map(function(cell) {
      var s = String(cell === null || cell === undefined ? '' : cell);
      if (s.indexOf(',') !== -1 || s.indexOf('"') !== -1 || s.indexOf('\n') !== -1) {
        s = '"' + s.replace(/"/g, '""') + '"';
      }
      return s;
    }).join(',');
  }).join('\r\n');

  // Filename with timestamp
  var now = new Date();
  var filename = 'DPR_DISCHARGE_' +
    String(now.getDate()).padStart(2,'0') +
    String(now.getMonth()+1).padStart(2,'0') +
    now.getFullYear() + '_' +
    String(now.getHours()).padStart(2,'0') +
    String(now.getMinutes()).padStart(2,'0') + '.csv';

  // Android WebView: route through native save dialog (blob/<a download> is ignored)
  if (window.AndroidBridge && typeof window.AndroidBridge.exportFile === 'function') {
    var csvB64 = btoa(unescape(encodeURIComponent('\uFEFF' + csv)));
    window.AndroidBridge.exportFile(filename, 'text/csv;charset=utf-8;', csvB64);
    return;
  }

  // iOS WKWebView: native share sheet via the ios-app-build bridge (supersedes the iOS modal below)
  if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) {
    window.webkit.messageHandlers.iosBridge.postMessage({
      filename: filename,
      mime: 'text/csv;charset=utf-8;',
      base64: btoa(unescape(encodeURIComponent('\uFEFF' + csv)))
    });
    return;
  }

  // Download via Blob (Desktop/Android) — then show iOS modal
  try {
    var blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' }); // BOM for Excel
    var url  = URL.createObjectURL(blob);
    var a    = document.createElement('a');
    a.href = url; a.download = filename; a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 3000);
  } catch(e) { /* iOS fallback below */ }

  // iOS-safe modal with copy option
  _showCSVModal(csv, filename);
}

// EXPORT SYSTEM — iOS/Android/Desktop compatible
// Strategy:
//   1. Build JSON string, store in module-level var (never on DOM node)
//   2. Try programmatic <a download> click (works on desktop + Android)
//   3. Always open the Export Modal which gives the user 3 iOS-safe methods:
//      A) "OPEN AS FILE" — opens data: URI in new tab; user can long-press → Save

var _exportJsonCache = '';

function exportData() {

      new Date().getFullYear() + '_' +
      String(new Date().getHours()).padStart(2,'0') +
      String(new Date().getMinutes()).padStart(2,'0') + '.json';
    _exportJsonCache = JSON.stringify(data, null, 2);

    // Android WebView: route through native save dialog (blob/<a download> is ignored)
    if (window.AndroidBridge && typeof window.AndroidBridge.exportFile === 'function') {
      var _jb64 = btoa(unescape(encodeURIComponent(_exportJsonCache)));
      window.AndroidBridge.exportFile(_exportFilename, 'application/json', _jb64);

      }
      return;

    // iOS WKWebView: native share sheet via the ios-app-build bridge
    if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) {
      window.webkit.messageHandlers.iosBridge.postMessage({
        filename: _exportFilename,
        mime: 'application/json',
        base64: btoa(unescape(encodeURIComponent(_exportJsonCache)))
      });
      var _iInd2 = document.getElementById('save-indicator');

        var _iPrev2 = getSaveIndicator();

        _iInd2.style.opacity = '1';
        setTimeout(function() { setSaveIndicator(_iPrev2.ico, _iPrev2.txt); _iInd2.style.opacity = '0'; }, 2500);
      }
      return;
    }

    try {
      var blob = new Blob([_exportJsonCache], { type: 'application/json' });
      var url  = URL.createObjectURL(blob);
      var a    = document.createElement('a');
      a.href = url;
      a.download = _exportFilename;
      a.style.display = 'none';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function() { URL.revokeObjectURL(url); }, 3000);
    } catch (e2) { /* iOS fallback below */ }

    showExportModal();

    var ind = document.getElementById('save-indicator');
    if (ind) {
      var prevTxt = getSaveIndicator();
      setSaveIndicator(ICO_IMPORT, 'EXPORTED');
      ind.style.opacity = '1';
      setTimeout(function() { setSaveIndicator(prevTxt.ico, prevTxt.txt); ind.style.opacity = '0'; }, 2500);
    }
  } catch(e) {
    alert('Export failed: ' + e.message);
  }
}

function exportCopyToClipboard() {
  var jsonStr = _exportJsonCache || '';
  var msgEl   = document.getElementById('export-copy-msg');
  var btn     = document.getElementById('export-copy-btn');

  function onSuccess() {
    if (msgEl) { setIconText(msgEl, ICO_CHECK, 'COPIED — paste into a .json file on your desktop, then Import.'); msgEl.style.color = '#7fbf9b'; msgEl.style.display = 'block'; }
    if (btn)   { setIconText(btn, ICO_CHECK, 'COPIED!'); setTimeout(function() { setIconText(btn, ICO_COPY, 'COPY TO CLIPBOARD'); }, 3000); }
  }
  function onFail() {
    var ta = document.getElementById('export-json-area');
    if (ta) { ta.select(); ta.setSelectionRange(0, 99999); }
    if (msgEl) { setIconText(msgEl, ICO_ALERT, 'Auto-copy failed — text is selected, copy it manually.'); msgEl.style.color = '#b8c0c8'; msgEl.style.display = 'block'; }
  }

  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(jsonStr).then(onSuccess).catch(onFail);
  } else {
    // execCommand fallback (older WebKit)
    var ta = document.getElementById('export-json-area');
    if (ta) {
      ta.select();
      ta.setSelectionRange(0, 99999);
      try {
        var ok = document.execCommand('copy');
        if (ok) { onSuccess(); } else { onFail(); }
      } catch(e) { onFail(); }
    } else { onFail(); }
  }
}

// ========================================
// IMPORT — load .json file into app
// ========================================
function importData(event) {
  const file = event.target.files[0];
  if (!file) return;
  event.target.value = '';

  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      var raw = e.target.result;
      if (typeof raw === 'string') raw = raw.replace(/^\uFEFF/, '').trim();

      var data;
      try {
        data = JSON.parse(raw);
      } catch(parseErr) {
        var preview = raw ? raw.substring(0, 200) : '(empty file)';
        alert('Import failed — the file could not be read as JSON.\n\nError: ' + parseErr.message + '\n\nFile starts with:\n' + preview);
        return;
      }

      var normalized = normalizeAppState(data);
      // Accept any export that contains at least one recognised section.
      var hasInputs    = normalized.inputs && Object.keys(normalized.inputs).length > 0;
      var hasDprLog    = Array.isArray(normalized.dprLog)     && normalized.dprLog.length > 0;
      var hasDaily     = Array.isArray(normalized.dailyDates) && normalized.dailyDates.length > 0;
      var hasDprInputs = normalized.dprInputs && Object.keys(normalized.dprInputs).length > 0;
      if (!hasInputs && !hasDprLog && !hasDaily && !hasDprInputs) {
        alert('Invalid file — this does not appear to be a Cargo Discharge export.\n\nMake sure you are selecting the correct .json file exported from this app.');
        return;
      }

      var dprCount   = normalized.dprLog ? normalized.dprLog.length : 0;
      var inputCount = Object.keys(normalized.inputs || {}).length;
      var logDates   = normalized.dailyDates ? normalized.dailyDates.length : 0;

      if (!confirm(
        'Import data from file?\n\nThis will overwrite your current data.\n\n' +
        'File contains:\n' +
        '• ' + inputCount + ' input values\n' +
        '• ' + dprCount + ' DPR log entries\n' +
        '• ' + logDates + ' daily log date(s)'
      )) return;

      localStorage.setItem(STORAGE_KEY, JSON.stringify(normalized));
      location.reload();
    } catch(err) {
      alert('Import failed — unexpected error.\n' + err.message);
    }
  };
  reader.onerror = function() {
    alert('Import failed — could not read the file. Please try again.');
  };
  reader.readAsText(file, 'UTF-8');
}

function parseDPRDateTime(dateStr, timeStr) {
  if (!dateStr || typeof dateStr !== 'string') return null;
  // Validate ISO date pattern YYYY-MM-DD
  if (!/^\d{4}-\d{2}-\d{2}$/.test(dateStr)) return null;

  // Sanitize time — strip non-digits, pad to 4
  var cleanT = (timeStr || '0000').replace(/[^0-9]/g, '').padStart(4, '0').slice(-4);
  var h = parseInt(cleanT.slice(0, 2), 10);
  var m = parseInt(cleanT.slice(2, 4), 10);
  if (isNaN(h) || isNaN(m)) { h = 0; m = 0; }

  // Handle out-of-range hours/minutes (eg user types 25:99) by rolling forward
  var extraDays = 0;
  if (h >= 24) { extraDays = Math.floor(h / 24); h = h % 24; }
  if (m >= 60) { var extraH = Math.floor(m / 60); m = m % 60; h += extraH; if (h >= 24) { extraDays += Math.floor(h / 24); h = h % 24; } }

  var d = new Date(dateStr + 'T' + String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0') + ':00');
  if (extraDays) d.setDate(d.getDate() + extraDays);
  return isNaN(d.getTime()) ? null : d;
}

function calcDPR() {
  const prevEl = document.getElementById('dpr-prev');
  const currEl = document.getElementById('dpr-curr');
  if (!prevEl || !currEl) return;
  const prev = parseFloat(prevEl.value);
  const curr = parseFloat(currEl.value);
  const plan = getN('tc-val');

  const errEl   = document.getElementById('dpr-error');
  const resBox  = document.getElementById('dpr-result-box');
  const res24h  = document.getElementById('dpr-result-24h');
  const resRate = document.getElementById('dpr-result-rate');
  const resRem  = document.getElementById('dpr-result-rem');
  if (!errEl || !resBox) return;

  setText('dpr-sc-plan',     fmt(plan));
  setText('dpr-plan-linked', fmt(plan) + ' MT');

  errEl.style.display  = 'none';
  resBox.style.display = 'none';

  const currRaw = (document.getElementById('dpr-curr') || {}).value || '';
  if (isNaN(curr) || currRaw.trim() === '') {
    if (dprLog.length === 0) { setText('dpr-sc-24h','—'); setText('dpr-sc-rate','—'); setText('dpr-sc-current','—'); }
    updateDPRETA(NaN, NaN, plan);
    return;
  }

  // DISCHARGE: curr = cargo still onboard now; remain = curr (what's left to discharge)
  setText('dpr-sc-current', fmt(curr));
  setText('dpr-sc-remain',  fmt(Math.max(curr, 0)));
  animSCard('dpr-sc-current');
  animSCard('dpr-sc-remain');

  // DISCHARGE VALIDATION: current onboard MUST be less than previous onboard
  if (!isNaN(prev) && curr > prev) {
    setIconText(errEl, ICO_ALERT, 'Error: Current total onboard cannot be greater than previous — cargo is being discharged.');
    errEl.style.display = 'block';
    setText('dpr-sc-24h','ERROR'); setText('dpr-sc-rate','ERROR');
    updateDPRETA(NaN, NaN, plan);
    return;
  }

  const startDateStr = (document.getElementById('dpr-start-date') || {}).value || '';
  const startTimeStr = (document.getElementById('dpr-start-time') || {}).value || '0000';
  const commencedDT  = parseDPRDateTime(startDateStr, startTimeStr);

  const currDateStr = (document.getElementById('dpr-date') || {}).value || '';
  const currTimeStr = (document.getElementById('dpr-time') || {}).value || '1730';
  const currentDT   = parseDPRDateTime(currDateStr, currTimeStr);

  let prevDT = null;
  if (dprLog.length === 0) {
    prevDT = commencedDT;
  } else {
    const lastISO = dprLog[dprLog.length - 1].rawDateISO;
    prevDT = lastISO ? new Date(lastISO) : commencedDT;
  }

  // DISCHARGE: qty discharged this period = prev onboard − curr onboard (positive number)
  let periodRate = NaN;
  let qtyPeriod  = isNaN(prev) ? (plan - curr) : (prev - curr);
  let diffHours  = NaN;

  if (currentDT && prevDT) {
    diffHours = (currentDT - prevDT) / (1000 * 60 * 60);
    if (diffHours > 0) {
      periodRate = qtyPeriod / diffHours;
    } else {
      setIconText(errEl, ICO_ALERT, 'Error: Report date/time must be after previous entry or commenced time.');
      errEl.style.display = 'block';
      updateDPRETA(NaN, NaN, plan);
      return;
    }
  }

  // DISCHARGE overall avg: total discharged so far ÷ total hours elapsed
  // Total discharged = plan − curr (how much has left the hold since start)
  let overallAvgRate = NaN;
  if (commencedDT && currentDT) {
    const totalHoursElapsed = (currentDT - commencedDT) / (1000 * 60 * 60);
    if (totalHoursElapsed > 0) overallAvgRate = (plan - curr) / totalHoursElapsed;
  }
  if (isNaN(overallAvgRate) && dprLog.length > 0) {
    const sumHrs = dprLog.reduce((a,e) => a + (e.diffHours||0), 0);
    overallAvgRate = sumHrs > 0
      ? dprLog.reduce((a,e) => a + (e.qtyPeriod||0), 0) / sumHrs
      : dprLog.reduce((a,e) => a + e.rate, 0) / dprLog.length;
  }

  // DISCHARGE remain = cargo still onboard = curr
  const remain = Math.max(curr, 0);

  resBox.style.display = 'block';
  res24h.textContent   = fmt(qtyPeriod) + ' MT' + (isNaN(diffHours) ? '' : ' (' + diffHours.toFixed(1) + ' hrs)');
  resRate.textContent  = isNaN(periodRate) ? '—' : periodRate.toFixed(2) + ' MT/HR';
  resRem.textContent   = fmt(remain) + ' MT';

  setText('dpr-sc-24h',  fmt(qtyPeriod));
  setText('dpr-sc-rate', isNaN(overallAvgRate) ? (isNaN(periodRate) ? '—' : periodRate.toFixed(2)) : overallAvgRate.toFixed(2));

  updateDPRETA(isNaN(periodRate) ? overallAvgRate : periodRate, remain, plan);
  scheduleAutoSave();
}

function updateDPRETA(rate, remain, plan) {
  const etaRem  = document.getElementById('dpr-eta-rem');
  const etaRate = document.getElementById('dpr-eta-rate');
  const etaHrs  = document.getElementById('dpr-eta-hrs');
  const etaDt   = document.getElementById('dpr-eta-dt');

  if (!etaRem || !etaRate || !etaHrs || !etaDt) return;
  if (isNaN(rate) || rate <= 0 || isNaN(remain)) {
    etaRem.textContent = '—'; etaRate.textContent = '—';
    etaHrs.textContent = '—'; etaDt.textContent   = '—';
    return;
  }

  // remain = cargo still onboard; rate = MT/HR discharge rate
  const remVal = Math.max(remain, 0);
  etaRem.textContent  = fmt(remVal) + ' MT';
  etaRate.textContent = rate.toFixed(2) + ' MT/HR';

  if (remVal === 0) {
    etaHrs.textContent = '0.00 HRS';
    etaDt.textContent  = 'DISCHARGE COMPLETE';
    etaDt.style.color  = 'var(--green)';
    return;
  }

  const hrsToComplete = remVal / rate;
  etaHrs.textContent  = hrsToComplete.toFixed(2) + ' HRS';

  const dateEl = document.getElementById('dpr-date');
  const timeEl = document.getElementById('dpr-time');
  if (dateEl && dateEl.value) {
    const hh = parseInt((timeEl.value||'1730').slice(0,2), 10);
    const mm = parseInt((timeEl.value||'1730').slice(2,4), 10);
    const base    = new Date(dateEl.value + 'T' + String(hh).padStart(2,'0') + ':' + String(mm).padStart(2,'0') + ':00');
    const etaDate = new Date(base.getTime() + hrsToComplete * 3600 * 1000);
    const dd  = String(etaDate.getDate()).padStart(2,'0');
    const mo  = String(etaDate.getMonth()+1).padStart(2,'0');
    const yy  = etaDate.getFullYear();
    const eh  = String(etaDate.getHours()).padStart(2,'0');
    const em  = String(etaDate.getMinutes()).padStart(2,'0');
    etaDt.textContent = `${dd}/${mo}/${yy} — ${eh}${em} LT`;
    etaDt.style.color = 'var(--green)';
  } else {
    etaDt.textContent = hrsToComplete.toFixed(1) + ' hrs from now';
  }
}

function addDPREntry() {
  const prev = parseFloat(document.getElementById('dpr-prev').value);
  const curr = parseFloat(document.getElementById('dpr-curr').value);
  const plan = getN('tc-val');
  const date = document.getElementById('dpr-date').value;
  const time = document.getElementById('dpr-time').value;

  if (isNaN(curr)) { alert('Please enter Current total onboard before adding to log.'); return; }
  if (!date) { alert('Please set a Report Date before adding to log.'); return; }
  // DISCHARGE: current onboard must be LESS than previous onboard
  if (!isNaN(prev) && curr > prev) {
    alert('Error: Current total onboard cannot be greater than previous — cargo is being discharged.');
    return;
  }

  const startDateStr = (document.getElementById('dpr-start-date') || {}).value || '';
  const startTimeStr = (document.getElementById('dpr-start-time') || {}).value || '0000';
  const commencedDT  = parseDPRDateTime(startDateStr, startTimeStr);
  if (!commencedDT) {
    if (!confirm('Discharging Commenced date/time is not set — period rate will be estimated. Continue?')) return;
  }

  const currentDT = parseDPRDateTime(date, time);
  if (!currentDT) {
    alert('Error: Report Date/Time is invalid. Please set a valid date and time.');
    return;
  }

  let prevDT = null;
  if (dprLog.length === 0) {
    prevDT = commencedDT;
  } else {
    const lastISO = dprLog[dprLog.length - 1].rawDateISO;
    prevDT = lastISO ? new Date(lastISO) : commencedDT;
  }

  // DISCHARGE: discharged this period = previous onboard − current onboard
  const prevOnboard = isNaN(prev) ? plan : prev;
  const qtyPeriod   = prevOnboard - curr;
  let diffHours = 0, periodRate = 0;

  if (currentDT && prevDT) {
    diffHours  = (currentDT - prevDT) / (1000 * 60 * 60);
    if (diffHours <= 0) {
      alert('Error: Report time must be AFTER previous entry / commenced time.');
      return;
    }
    periodRate = qtyPeriod / diffHours;
  } else {
    diffHours  = 24;
    periodRate = qtyPeriod / 24;
  }

  // DISCHARGE overall avg: total discharged (plan − curr) ÷ total elapsed hours
  let overallAvgRate = 0;
  if (commencedDT && currentDT) {
    const totalHrs = (currentDT - commencedDT) / (1000 * 60 * 60);
    overallAvgRate = totalHrs > 0 ? (plan - curr) / totalHrs : periodRate;
  }

  const entry = {
    id:          Date.now(),
    date:        date ? fmtDMY(date) : '—',
    rawDateISO:  currentDT ? currentDT.toISOString() : '',
    time:        time,
    prev:        prevOnboard,
    curr:        curr,
    qtyPeriod:   qtyPeriod,
    diffHours:   isFinite(diffHours)   ? diffHours   : 0,
    rate:        isFinite(periodRate)  ? periodRate  : 0,
    overallRate: isFinite(overallAvgRate) ? overallAvgRate : 0,
    remain:      Math.max(curr, 0)
  };

  dprLog.push(entry);
  renderDPRLog();
  scheduleAutoSave();

  // Auto-fill PREVIOUS TOTAL with current reading for next entry
  document.getElementById('dpr-prev').value = curr;
  document.getElementById('dpr-curr').value = '';
  calcDPR();
}

function deleteDPREntry(id) {
  dprLog = dprLog.filter(e => e.id !== id);
  renderDPRLog();
  scheduleAutoSave();
}

function renderDPRLog() {
  const tbody    = document.getElementById('dpr-log-body');
  const totalsEl = document.getElementById('dpr-log-totals');
  if (!tbody || !totalsEl) return;

  if (!Array.isArray(dprLog) || dprLog.length === 0) {
    tbody.innerHTML = '<tr id="dpr-empty-row"><td colspan="7" style="text-align:center;padding:24px;font-family:var(--mono);font-size:0.75rem;color:var(--muted);letter-spacing:1px;">NO ENTRIES YET — ADD A DISCHARGE ENTRY TO BEGIN</td></tr>';
    totalsEl.style.display = 'none';
    return;
  }

  let html = '';
  dprLog.forEach((e, i) => {
    // Defensive: numeric fields might come from older imports as strings
    const rate    = Number(e.rate)      || 0;
    const prev    = Number(e.prev)      || 0;
    const curr    = Number(e.curr)      || 0;
    const diffHrs = Number(e.diffHours) || 0;
    const rateColor = rate >= 1000 ? 'var(--green)' : rate >= 500 ? 'var(--accent)' : 'var(--text)';
    const hrsDisp   = diffHrs ? diffHrs.toFixed(1) + 'h' : '—';
    const qtyDisp   = e.qtyPeriod !== undefined ? Number(e.qtyPeriod) || 0 : (Number(e.qty24h) || 0);
    html += `<tr><td colspan="7"><div class="dpr-card">
      <div class="dpr-card-hdr">
        <span class="dpr-card-idx">${i+1}</span>
        <span class="dpr-card-date">${escHtml(e.date)}</span>
        <span class="dpr-card-time">${escHtml(e.time)} LT · ${hrsDisp}</span>
        <span class="dpr-card-del" onclick="deleteDPREntry(${e.id})" onmouseover="this.style.opacity='1'" onmouseout="this.style.opacity='0.6'">${ICO_CLOSE}</span>
      </div>
      <div class="dpr-card-grid">
        <div><div class="dpr-card-lbl">PREV</div><div class="dpr-card-val" style="color:var(--muted);">${fmt(prev)}</div></div>
        <div><div class="dpr-card-lbl">CURR</div><div class="dpr-card-val" style="color:var(--gold);font-weight:bold;">${fmt(curr)}</div></div>
        <div><div class="dpr-card-lbl" style="color:var(--green);">PERIOD</div><div class="dpr-card-val" style="color:var(--green);font-weight:bold;">${fmt(qtyDisp)}</div></div>
      </div>
      <div class="dpr-card-rate">
        <span class="dpr-card-lbl" style="margin-bottom:0;">RATE</span>
        <span class="dpr-card-val" style="color:${rateColor};">${rate.toFixed(2)} MT/HR</span>
      </div>
      </div></td></tr>`;
  });
  tbody.innerHTML = html;

  // DISCHARGE: last entry's curr = cargo still onboard
  const currOnboard = dprLog[dprLog.length - 1].curr;
  const lastPeriod  = dprLog[dprLog.length - 1].qtyPeriod !== undefined
                      ? dprLog[dprLog.length - 1].qtyPeriod
                      : (dprLog[dprLog.length - 1].qty24h || 0);

  // Overall avg = total MT discharged ÷ total hours
  const plan = getN('tc-val');
  const overallAvgRate = dprLog[dprLog.length - 1].overallRate
    || (function() {
         const totalDischarged = dprLog.reduce((a,e) => a + (e.qtyPeriod||0), 0);
         const sumHrs          = dprLog.reduce((a,e) => a + (e.diffHours||0), 0);
         return sumHrs > 0 ? totalDischarged / sumHrs
                           : dprLog.reduce((a,e)=>a+e.rate,0)/dprLog.length;
       })();

  setText('dpr-log-last24h',      fmt(lastPeriod) + ' MT');
  setText('dpr-log-total-loaded', fmt(currOnboard) + ' MT');  // cargo remaining onboard
  setText('dpr-log-avg-rate',     overallAvgRate.toFixed(2) + ' MT/HR');
  setText('dpr-log-count',        dprLog.length);

  // Store for WeChat preview
  window._dprAvgRate = overallAvgRate;

  // ETA: remain = cargo still onboard = currOnboard
  const logEtaHrsEl = document.getElementById('dpr-log-eta-hrs');
  const logEtaDtEl  = document.getElementById('dpr-log-eta-dt');
  const etaRemain   = Math.max(currOnboard, 0);

  if (overallAvgRate > 0 && etaRemain > 0 && logEtaHrsEl && logEtaDtEl) {
    const etaHours = etaRemain / overallAvgRate;
    const lastISO  = dprLog[dprLog.length - 1].rawDateISO;
    const baseDate = lastISO ? new Date(lastISO) : new Date();
    const etaDate  = new Date(baseDate.getTime() + etaHours * 3600 * 1000);

    logEtaHrsEl.textContent = etaHours.toFixed(2) + ' HRS';

    var totalMins  = Math.round(etaHours * 60);
    var etaDays    = Math.floor(totalMins / 1440);
    var etaHrsRem  = Math.floor((totalMins % 1440) / 60);
    var etaMinsRem = totalMins % 60;
    var daysStr = '';
    if (etaDays > 0)    daysStr += etaDays + ' day' + (etaDays !== 1 ? 's' : '') + ' ';
    if (etaHrsRem > 0)  daysStr += etaHrsRem + ' hr' + (etaHrsRem !== 1 ? 's' : '') + ' ';
    daysStr += etaMinsRem + ' min' + (etaMinsRem !== 1 ? 's' : '');
    var logEtaDaysEl = document.getElementById('dpr-log-eta-days');
    if (logEtaDaysEl) logEtaDaysEl.textContent = daysStr.trim();

    const dd  = String(etaDate.getDate()).padStart(2,'0');
    const mm  = String(etaDate.getMonth()+1).padStart(2,'0');
    const yy  = etaDate.getFullYear();
    const hh  = String(etaDate.getHours()).padStart(2,'0');
    const min = String(etaDate.getMinutes()).padStart(2,'0');
    logEtaDtEl.textContent = dd+'/'+mm+'/'+yy+' — '+hh+min+' LT';

    const etaBlock = document.getElementById('dpr-log-eta-block');
    if (etaBlock) etaBlock.style.display = 'flex';

  } else if (etaRemain <= 0 && logEtaHrsEl && logEtaDtEl) {
    logEtaHrsEl.textContent = '0.00 HRS';
    const dEl = document.getElementById('dpr-log-eta-days');
    if (dEl) dEl.textContent = '0 hrs 0 mins';
    logEtaDtEl.textContent = 'DISCHARGE COMPLETE';

  } else if (logEtaHrsEl && logEtaDtEl) {
    logEtaHrsEl.textContent = '—';
    const dEl2 = document.getElementById('dpr-log-eta-days');
    if (dEl2) dEl2.textContent = '—';
    logEtaDtEl.textContent = '—';
  }

  const voyVal = (document.getElementById('voy-header') || {}).value || '';
  const badge  = document.getElementById('dpr-log-voy-badge');
  if (badge) {
    if (voyVal.trim()) { setIconText(badge, ICO_ANCHOR, 'VOY ' + voyVal.trim()); } else { badge.textContent = ''; }
    badge.style.display = voyVal.trim() ? 'inline-block' : 'none';
  }

  // Summary cards
  setText('dpr-sc-current', fmt(currOnboard));   // cargo onboard now
  setText('dpr-sc-24h',     fmt(lastPeriod));     // discharged last period
  setText('dpr-sc-rate',    overallAvgRate.toFixed(2));
  setText('dpr-sc-remain',  fmt(currOnboard));    // remaining = onboard
  totalsEl.style.display = 'block';
}

function updateDPRCardsFromLog() {
  if (!dprLog || dprLog.length === 0) return;

  setText('dpr-sc-remain',  fmt(Math.max(last.curr, 0)));
  updateDPRETA(overallAvg, Math.max(last.curr, 0), plan);
}

// ========================================
function parseDPRTimeStr(str) {
  var s = (str || '').replace(/[^0-9]/g, '').padStart(4, '0').slice(-4);
  var h = parseInt(s.slice(0, 2), 10);
  var m = parseInt(s.slice(2, 4), 10);
  if (isNaN(h) || isNaN(m)) return null;
  h = Math.min(h, 23); m = Math.min(m, 59);
  return { h: h, m: m };
}
function toDPRTimeStr(h, m) {
  return String(h).padStart(2,'0') + String(m).padStart(2,'0');
}
function stepDPRTime(id, delta) {
  var el = document.getElementById(id);
  if (!el) return;
  var t = parseDPRTimeStr(el.value) || { h: 0, m: 0 };
  var totalMins = ((t.h * 60 + t.m + delta) % 1440 + 1440) % 1440;
  el.value = toDPRTimeStr(Math.floor(totalMins / 60), totalMins % 60);
  calcDPR();
  if (typeof scheduleAutoSave === 'function') scheduleAutoSave();
}
function fmtDPRTimeInp(el) {
  var raw = el.value.replace(/[^0-9]/g, '');
  if (raw.length > 4) raw = raw.slice(-4);
  el.value = raw;
}
function normDPRTimeInp(el) {
  var t = parseDPRTimeStr(el.value);
  if (!t) { el.value = '0000'; return; }
  el.value = toDPRTimeStr(t.h, t.m);
}

function adjustSF(delta) {
  const el = document.getElementById('sf-val');
  if (!el) return;
  const current = parseFloat(el.value);
  const safeCurrent = isFinite(current) ? current : 0;
  // Clamp to a sensible positive minimum to prevent zero-division downstream.
  let next = Math.round((safeCurrent + delta) * 10) / 10;
  if (next < 0.1) next = 0.1;
  el.value = next;
  recalc();
  scheduleAutoSave();
  el.style.transition = 'background 0.15s';
  el.style.background = delta > 0 ? 'rgba(127,191,155,0.25)' : 'rgba(207,139,151,0.2)';
  setTimeout(function(){ el.style.background = 'rgba(139,146,154,0.1)'; }, 300);
}

// ═══════════════════════════════════════════════════════════════════
// HOLD-LEVEL SF STEPPER — stepHoldSF(holdNum, delta)
// delta: ±1 (coarse) or ±0.01 (fine)
// The centre input #hsfN is both the display and the data store.
// Empty/zero = use Global SF (placeholder shows "GLOBAL").
// ═══════════════════════════════════════════════════════════════════
function stepHoldSF(n, delta) {
  const inp   = document.getElementById('hsf' + n);
  const badge = document.getElementById('hsf-badge-' + n);
  if (!inp) return;

  const current = parseFloat(inp.value) || 0;
  const globalSF = parseFloat(document.getElementById('sf-val').value) || 100;
  // If no override yet and stepping down, seed from Global SF
  const base = (current > 0) ? current : globalSF;

  // Round to 2 dp to avoid float drift
  let next = Math.round((base + delta) * 100) / 100;
  if (next < 0.01) next = 0.01;

  inp.value = next;
  inp.style.color = ''; // restore gold (remove any placeholder muted colour)

  // Badge
  if (badge) badge.classList.add('active');

  // Flash animation on the input itself
  inp.style.transition = 'background 0.12s';
  inp.style.background = delta > 0 ? 'rgba(127,191,155,0.18)' : 'rgba(207,139,151,0.15)';
  setTimeout(function(){ inp.style.background = ''; }, 250);

  recalc();
  scheduleAutoSave();
}

/** Called on manual keystroke inside the SF input */
function onHoldSFType(n) {
  const inp   = document.getElementById('hsf' + n);
  const badge = document.getElementById('hsf-badge-' + n);
  if (!inp) return;
  const v = parseFloat(inp.value) || 0;
  if (badge) badge.classList.toggle('active', v > 0);
  recalc();
  scheduleAutoSave();
}

/** On blur: clamp to 2dp and clear if zero/invalid */
function onHoldSFBlur(n) {
  const inp   = document.getElementById('hsf' + n);
  const badge = document.getElementById('hsf-badge-' + n);
  if (!inp) return;
  const v = parseFloat(inp.value) || 0;
  if (v > 0) {
    inp.value = v.toFixed(2);
    if (badge) badge.classList.add('active');
  } else {
    inp.value = '';
    if (badge) badge.classList.remove('active');
  }
  recalc();
  scheduleAutoSave();
}

/** Called once on restore / init to sync display state */
function syncHoldSFDisplay(n) {
  const inp   = document.getElementById('hsf' + n);
  const badge = document.getElementById('hsf-badge-' + n);
  if (!inp) return;
  const v = parseFloat(inp.value) || 0;
  if (v > 0) {
    inp.value = v.toFixed(2);
    if (badge) badge.classList.add('active');
  } else {
    inp.value = '';
    if (badge) badge.classList.remove('active');
  }
}

// STOW PLAN LOCK — protects sp1–sp6 from accidental edits
// ═══════════════════════════════════════════════════════════════════
(function initSPLocks() {

// ═══════════════════════════════════════════════════════════════════
// HEEL LIST SELECTOR
// ═══════════════════════════════════════════════════════════════════
(function() {
  var HEEL_LIST = [];
  for (var i = -50; i <= 50; i++) { HEEL_LIST.push(Math.round(i * 10) / 100); }
  var heelIdx = HEEL_LIST.indexOf(0);

  function updateHeelDisplay(direction) {
    var val    = HEEL_LIST[heelIdx];
    window._heelSelectorValue = val;
    var valEl  = document.getElementById('heel-list-val');
    var sideEl = document.getElementById('heel-list-side');
    if (!valEl || !sideEl) return;

    var sign  = val > 0 ? '+' : '';
    valEl.textContent = sign + val.toFixed(1) + '°';
    valEl.className   = 'heel-val ' + (val > 0.04 ? 'stbd-heel' : val < -0.04 ? 'port-heel' : 'even-heel');
    sideEl.textContent = val > 0.04 ? 'STBD' : val < -0.04 ? 'PORT' : 'EVEN KEEL';

    if (direction !== 0) {
      var animClass = direction > 0 ? 'heel-slide-right' : 'heel-slide-left';
      valEl.classList.remove('heel-slide-right','heel-slide-left');
      void valEl.offsetWidth;
      valEl.classList.add(animClass);
      setTimeout(function() { valEl.classList.remove(animClass); }, 280);
    }

    var sideText = val > 0.04 ? 'STBD' : val < -0.04 ? 'PORT' : 'EVEN KEEL';
    window._heelLine = 'Heel: ' + sign + val.toFixed(1) + '° (' + sideText + ')';

    // Sync to heel-angle input
    var heelInp = document.getElementById('heel-angle');
    if (heelInp) {
      var absVal  = Math.abs(val);
      var prevVal = parseFloat(heelInp.value) || 0;
      heelInp.value = absVal.toFixed(1);
      if (direction !== 0 && Math.abs(absVal - prevVal) > 0.001) {
        heelInp.classList.remove('heel-inp-pulse'); void heelInp.offsetWidth;
        heelInp.classList.add('heel-inp-pulse');
        setTimeout(function() { heelInp.classList.remove('heel-inp-pulse'); }, 420);
      }
      // Sync sign button
      var signBtn = document.getElementById('heel-sign-btn');
      if (signBtn) {
        if (val > 0.04) {
          signBtn.setAttribute('data-sign','1'); signBtn.textContent = '+';
          signBtn.style.borderColor='rgba(127,163,194,0.45)'; signBtn.style.background='rgba(127,163,194,0.08)'; signBtn.style.color='var(--accent)';
        } else if (val < -0.04) {
          signBtn.setAttribute('data-sign','-1'); signBtn.textContent = '−';
          signBtn.style.borderColor='rgba(139,146,154,0.45)'; signBtn.style.background='rgba(139,146,154,0.08)'; signBtn.style.color='var(--gold)';
        } else {
          signBtn.setAttribute('data-sign','1'); signBtn.textContent = '+';
          signBtn.style.borderColor='rgba(127,163,194,0.35)'; signBtn.style.background='rgba(127,163,194,0.05)'; signBtn.style.color='var(--muted)';
        }
      }
      if (typeof recalcStowage === 'function') recalcStowage();
    }
  }

  window.getHeelSelectorValue = function() {
    return HEEL_LIST[heelIdx];
  };

  window.setHeelSelectorValue = function(value) {
    var target = toNum(value, 0);
    var bestIdx = 0;
    var bestDiff = Infinity;
    for (var j = 0; j < HEEL_LIST.length; j++) {
      var diff = Math.abs(HEEL_LIST[j] - target);
      if (diff < bestDiff) { bestDiff = diff; bestIdx = j; }
    }
    heelIdx = bestIdx;
    updateHeelDisplay(0);
  };

  window.stepHeel = function(dir) {
    var next = heelIdx + dir;
    if (next < 0) next = 0;
    if (next >= HEEL_LIST.length) next = HEEL_LIST.length - 1;
    heelIdx = next;
    updateHeelDisplay(dir);
    if (typeof scheduleAutoSave === 'function') scheduleAutoSave();
  };

  if (document.readyState !== 'loading') updateHeelDisplay(0);
  else document.addEventListener('DOMContentLoaded', function() { updateHeelDisplay(0); });
})();

    '.voy-label,.btn-copy,.btn-save-log,.btn-danger,.section-note,.auto-link-badge,' +

    '.hold-inp-label,.m-input-label,.stow-field-label{gap:5px;}' +

    'var mine=function(){try{return parent.__glassActiveWindow()===window;}catch(e){return true;}};' +

    // sheet — the mode-switch CANCEL/SWITCH row would end up buried. This app has no
    // single modal class: every sheet is an ad-hoc position:fixed div appended to
    // <body> and later .remove()d, so match on shape rather than class name.
    'var sheetOpen=function(){' +
      'var k=document.body.children,i,el,cs;' +
      'for(i=0;i<k.length;i++){el=k[i];' +
        'if(el.nodeType!==1)continue;' +
        'cs=getComputedStyle(el);' +
        'if(cs.position==="fixed"&&(parseInt(cs.zIndex,10)||0)>=999&&cs.display!=="none")return true;}' +
      'return false;};' +
    'var lastSheet=null;' +
    'var syncChrome=function(){var s=sheetOpen();if(s===lastSheet)return;lastSheet=s;' +
      'if(!mine())return;' +
      'try{chrome&&chrome.postMessage(s?"modal-open":"modal-closed");}catch(e){}};' +
    'window.__glassSyncChrome=function(){lastSheet=null;syncChrome();};' +
    'new MutationObserver(syncChrome).observe(document.body,{childList:true});' +
    'syncChrome();' +

    // Native drops the bar when the keypad rises (it is pinned to the safe-area
    // bottom, which the WKWebView keyboard does not move). Mirror it here so the page
    // stops reserving the bar height. The 50 ms debounce lets the keyboard accessory
    // bar's up/down field-jump buttons carry focus between fields without a flash.
    'var t=null,isField=function(el){return el&&(el.tagName==="INPUT"||el.tagName==="TEXTAREA"||el.isContentEditable);};' +
    'document.addEventListener("focusin",function(e){if(!isField(e.target))return;' +
      'clearTimeout(t);document.body.classList.add("kb-open");});' +
    'document.addEventListener("focusout",function(e){if(!isField(e.target))return;' +
      'clearTimeout(t);t=setTimeout(function(){document.body.classList.remove("kb-open");},50);});' +

    'window.__glassSendTheme=sendTheme;' +
    'try{if(mine())chrome&&chrome.postMessage("ready");}catch(e){}' +
    '})();</scr' + 'ipt>';

  var frames = {};
  var active = null;

  // ── Safe-area relay ───────────────────────────────────────────────────────
  // env(safe-area-inset-*) resolves to 0 INSIDE an iframe — only the top-level
  // document sees the real values (and only with viewport-fit=cover). Measure
  // here, then push the px down to each frame as --sat / --sab so their CSS can
  // reserve room under the native glass tab bar.
  var probe = document.createElement('div');
  probe.style.cssText = 'position:fixed;left:0;bottom:0;width:0;visibility:hidden;pointer-events:none;' +
    'padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);';
  document.body.appendChild(probe);

  function insets() {
    var cs = getComputedStyle(probe);
    return { top: parseFloat(cs.paddingTop) || 0, bottom: parseFloat(cs.paddingBottom) || 0 };
  }

  function pushInsets(f) {
    if (!f) return;
    try {
      var i = insets();
      var r = f.contentDocument.documentElement;
      r.style.setProperty('--sat', i.top + 'px');
      r.style.setProperty('--sab', i.bottom + 'px');
    } catch (e) {}
  }

  function pushInsetsAll() {
    Object.keys(frames).forEach(function(m) { pushInsets(frames[m]); });
  }
  window.addEventListener('resize', pushInsetsAll);
  window.addEventListener('orientationchange', function() { setTimeout(pushInsetsAll, 120); });

  // ── Native glass tab bar forwarder ────────────────────────────────────────
  // evaluateJavaScript runs in the MAIN frame, so native cannot reach an
  // iframe's showTab() directly — it calls this instead.
  window.__glassSelectTab = function(id) {
    var f = frames[active];
    try { if (f && f.contentWindow.showTab) f.contentWindow.showTab(id); } catch (e) {}
  };

  // Let a frame check whether it is the visible one before it talks to native —
  // the inactive frame stays fully alive and would otherwise fight over the bar.
  window.__glassActiveWindow = function() {
    var f = frames[active];
    return f ? f.contentWindow : null;
  };

  function ensureFrame(mode) {
    if (frames[mode]) return frames[mode];
    var tpl = document.getElementById('tpl-' + mode);
    var f = document.createElement('iframe');
    f.id = 'frame-' + mode;
    f.title = 'CARGO ' + mode.toUpperCase();
    f.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;border:0;display:none;';
    document.body.appendChild(f);
    // Registered BEFORE the write: the glass script at the end of the written body
    // calls back into __glassActiveWindow() while document.write is still running,
    // and would otherwise not recognise itself as the visible frame. contentWindow
    // identity survives open/write/close, so this reference stays valid.
    frames[mode] = f;
    var d = f.contentDocument;
    d.open();
    d.write('<!DOCTYPE html><html><head>' + FRAME_HEAD + GLASS_CSS + '</head><body>' +
            tpl.innerHTML + ICO_CSS + GLASS_JS + '</body></html>');
    d.close();
    pushInsets(f);
    return f;
  }

  window.__switchMode = function(mode) {
    try { localStorage.setItem('cargo_app_mode', mode); } catch (e) {}
    active = mode;                      // before ensureFrame — see the note there
    var target = ensureFrame(mode);
    pushInsets(target);
    try {
      if (target.contentWindow && typeof target.contentWindow.__onModeShown === 'function') {
        target.contentWindow.__onModeShown();
      }
    } catch (e) {}
    var other = mode === 'discharge' ? 'loading' : 'discharge';
    if (frames[other]) frames[other].style.display = 'none';
    target.style.display = 'block';
    document.title = 'CARGO OPS — ' + (mode === 'discharge' ? 'DISCHARGE' : 'LOADING');

    // Re-point the native glass bar at whatever tab this mode is sitting on, and let
    // the newly-visible frame re-assert theme + sheet state now that mine() is true
    // for it. This MUST come after __onModeShown(), which is what re-applies
    // light-mode to the incoming frame — read the theme before it and the bar comes
    // back dark on a light-mode switch.
    try {
      var tb = window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.tabBridge;
      if (tb && target.contentWindow.__activeTab) tb.postMessage(target.contentWindow.__activeTab);
    } catch (e) {}
    try { target.contentWindow.__glassSendTheme && target.contentWindow.__glassSendTheme(); } catch (e) {}
    try { target.contentWindow.__glassSyncChrome && target.contentWindow.__glassSyncChrome(); } catch (e) {}
  };

  var mode = 'loading';
  try {
    if (localStorage.getItem('cargo_app_mode') === 'discharge') mode = 'discharge';
  } catch (e) { /* storage blocked — default to loading */ }
  window.__switchMode(mode);

  // Pre-warm the inactive app after boot settles so the first switch is instant too
  var other = mode === 'discharge' ? 'loading' : 'discharge';
  setTimeout(function() { ensureFrame(other); }, 1800);

  // The shell itself must never pinch-zoom (each app blocks it inside its own frame)
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(function(ev) {
    document.addEventListener(ev, function(e) { e.preventDefault(); }, { passive: false });
  });
})();
</script>
</body>
</html>
